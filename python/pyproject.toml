[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnc-remote-control-client"
version = "0.1.0"
description = "Typed Python client for the VNC Remote Control Server HTTP API"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VNC Remote Control Server contributors" }]
dependencies = []

[project.optional-dependencies]
websocket = ["websocket-client>=1.8,<2"]
mcp = ["mcp==2.1.1"]

[project.scripts]
vnc-remote-control-demo = "vnc_remote_control.demo:main"
vnc-remote-control-mcp = "vnc_remote_control.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vnc_remote_control = ["py.typed"]
