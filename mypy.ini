[mypy]
python_version = 3.11
strict = True
explicit_package_bases = True
namespace_packages = True
; python/src holds the installable vnc_remote_control package (not installed
; in every environment); tests/integration holds the R13 harness's sibling
; r13_*.py modules, resolved at runtime via the script-directory sys.path
; trick. Both need to be on mypy's import path the same way.
mypy_path = python/src:tests/integration
