[mypy]
python_version = 3.11
strict = True
explicit_package_bases = True
namespace_packages = True
; python/src holds the installable vnc_remote_control package (not installed
; in every environment); tests and tests/integration hold sibling test-support
; modules resolved at runtime via unittest/script-directory sys.path behavior.
; Keep mypy's import path aligned with those actual test execution paths.
mypy_path = python/src:tests:tests/integration
