[workspace]
resolver = "3"
members = [
  "crates/controller-api",
  "crates/libvnc-adapter",
  "crates/remote-desktop-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/ekkus93/vnc-remote-control-server"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
png = "0.18.1"
serde_json = "1.0.140"
subtle = "=2.6.1"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", default-features = false, features = ["env-filter", "fmt", "json"] }
tokio = { version = "=1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.2", default-features = false, features = ["util"] }
proptest = "1.7.0"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"

[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
