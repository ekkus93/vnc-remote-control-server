name: Post-final-polish asset acquisition

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact pinned documentation assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/swagger-ui/5.32.11 assets/redoc/2.5.3
          curl --fail --location --silent --show-error \
            https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.11/swagger-ui.css \
            --output assets/swagger-ui/5.32.11/swagger-ui.css
          curl --fail --location --silent --show-error \
            https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.11/swagger-ui-bundle.js \
            --output assets/swagger-ui/5.32.11/swagger-ui-bundle.js
          curl --fail --location --silent --show-error \
            https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.11/swagger-ui-standalone-preset.js \
            --output assets/swagger-ui/5.32.11/swagger-ui-standalone-preset.js
          curl --fail --location --silent --show-error \
            https://cdn.redoc.ly/redoc/v2.5.3/bundles/redoc.standalone.js \
            --output assets/redoc/2.5.3/redoc.standalone.js
          find assets -type f -print0 | sort -z | xargs -0 sha256sum > assets/SHA256SUMS

      - name: Upload exact pinned assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-final-polish-doc-assets-${{ github.run_id }}
          path: assets
          if-no-files-found: error
          retention-days: 2
