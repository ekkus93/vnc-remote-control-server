name: R10 runtime bootstrap

on:
  push:
    branches:
      - codex/r10-runtime

permissions:
  contents: write

concurrency:
  group: r10-runtime-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    name: Apply and validate R10 runtime patch
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/r10-runtime

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Apply runtime patch and compile repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r10_runtime_patch.py
          python3 tools/r10_runtime_repair.py

      - name: Format generated Rust
        run: cargo fmt --all

      - name: Refresh lockfile
        run: cargo check --workspace --all-targets --all-features

      - name: Run warning-denied Clippy
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Check generated shell syntax
        run: bash -n tests/http-e2e/run.sh

      - name: Commit validated runtime slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --check
          git commit -m "Complete R10 HTTP runtime and TigerVNC E2E"
          git push origin HEAD:codex/r10-runtime
