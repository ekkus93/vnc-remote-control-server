name: Repair R13 Deterministic Text Selection

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r13-selection-fix.yml

permissions:
  contents: write

concurrency:
  group: r13-selection-fix-master
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Replace platform-specific select-all shortcut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/r13_integration.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '    for keys in (["CTRL_LEFT", "a"], ["CTRL_LEFT", "v"]):\n'
          end_marker = '    inbound: dict[str, Any] | None = None\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('R13 selection markers were not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              '    def select_all_entry() -> None:\n'
              '        # Tk on X11 maps Ctrl+A to cursor-home rather than select-all. Use\n'
              '        # the portable Home then Shift+End sequence through the public API.\n'
              '        for keys, label in ((["HOME"], "home"), (["SHIFT_LEFT", "END"], "shift-end")):\n'
              '            selection = post_json(harness, "/v1/keyboard/chord", {"keys": keys})\n'
              '            require(selection.status == 202, f"{label} selection chord failed: {selection.status}")\n'
              '\n'
              '    select_all_entry()\n'
              '    response = post_json(harness, "/v1/keyboard/chord", {"keys": ["CTRL_LEFT", "v"]})\n'
              '    require(response.status == 202, f"clipboard paste chord failed: {response.status}")\n'
              '    harness.wait_desktop_state(lambda value: value.get("text") == OUTBOUND_CLIPBOARD)\n'
              '\n'
              '    select_all_entry()\n'
              '    response = post_json(harness, "/v1/keyboard/text", {"text": INBOUND_CLIPBOARD})\n'
              '    require(response.status == 202, "copy fixture typing failed")\n'
              '    harness.wait_desktop_state(lambda value: value.get("text") == INBOUND_CLIPBOARD)\n'
              '    select_all_entry()\n'
              '    response = post_json(harness, "/v1/keyboard/chord", {"keys": ["CTRL_LEFT", "c"]})\n'
              '    require(response.status == 202, "copy chord failed")\n'
              '\n'
          )
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          python3 -m py_compile tests/integration/r13_integration.py
          python3 -m unittest tests.test_integration_contract -v
          git diff --check

      - name: Commit repair directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add tests/integration/r13_integration.py
          git commit -m 'test: use portable R13 entry selection'
          git push origin HEAD:master
