name: Validate Final R13 Assertions

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r13-final-assertions.yml

permissions:
  contents: write

jobs:
  validate:
    name: Tighten and validate final R13 assertions
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Add explicit horizontal rejection and exact click counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          api_path = Path('crates/controller-api/src/api_contract.rs')
          api = api_path.read_text(encoding='utf-8')
          old_fields = (
              '    /// Signed vertical wheel steps.\n'
              '    pub delta_y: i32,\n'
          )
          new_fields = (
              '    /// Signed horizontal wheel steps. Nonzero values are rejected in v0.1.\n'
              '    #[serde(default)]\n'
              '    pub delta_x: i32,\n'
              '    /// Signed vertical wheel steps.\n'
              '    pub delta_y: i32,\n'
          )
          if api.count(old_fields) != 1:
              raise SystemExit(f'expected one scroll field block, found {api.count(old_fields)}')
          api = api.replace(old_fields, new_fields)

          old_command = (
              '        validate_scroll(0, self.delta_y)?;\n'
              '        Ok(WorkerCommand::Scroll {\n'
              '            coordinate: display.validate_coordinate(self.x, self.y)?,\n'
              '            delta_x: 0,\n'
              '            delta_y: self.delta_y,\n'
              '        })\n'
          )
          new_command = (
              '        validate_scroll(self.delta_x, self.delta_y)?;\n'
              '        Ok(WorkerCommand::Scroll {\n'
              '            coordinate: display.validate_coordinate(self.x, self.y)?,\n'
              '            delta_x: self.delta_x,\n'
              '            delta_y: self.delta_y,\n'
              '        })\n'
          )
          if api.count(old_command) != 1:
              raise SystemExit(f'expected one scroll conversion block, found {api.count(old_command)}')
          api = api.replace(old_command, new_command)

          test_marker = '    #[test]\n    fn text_support_matrix_and_byte_boundary_are_explicit() {\n'
          test_addition = (
              '    #[test]\n'
              '    fn horizontal_scroll_is_recognized_and_rejected_explicitly() {\n'
              '        let display = DisplayInfo {\n'
              '            width: 1280,\n'
              '            height: 800,\n'
              '            depth: 24,\n'
              '            revision: 1,\n'
              '            complete: true,\n'
              '        };\n'
              '        let vertical: PointerScrollRequest = serde_json::from_str(\n'
              '            r#"{\"x\":1,\"y\":1,\"delta_y\":1}"#,\n'
              '        )\n'
              '        .expect("vertical request parses");\n'
              '        assert_eq!(vertical.delta_x, 0);\n'
              '        assert!(vertical.into_command(display).is_ok());\n'
              '\n'
              '        let horizontal: PointerScrollRequest = serde_json::from_str(\n'
              '            r#"{\"x\":1,\"y\":1,\"delta_x\":1,\"delta_y\":0}"#,\n'
              '        )\n'
              '        .expect("horizontal field is recognized");\n'
              '        assert!(matches!(\n'
              '            horizontal.into_command(display),\n'
              '            Err(DesktopError::Configuration(_))\n'
              '        ));\n'
              '    }\n'
              '\n'
          )
          if api.count(test_marker) != 1:
              raise SystemExit('scroll regression test marker was not unique')
          api_path.write_text(api.replace(test_marker, test_addition + test_marker), encoding='utf-8')

          path = Path('tests/integration/r13_integration.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '            and left_down >= 4\n            and left_up >= 4\n            and middle_down >= 1\n            and right_down >= 1\n            and scroll_up >= 2\n            and scroll_down >= 1\n': (
                  '            and left_down == 4\n'
                  '            and left_up == 4\n'
                  '            and middle_down == 1\n'
                  '            and right_down == 1\n'
                  '            and scroll_up == 2\n'
                  '            and scroll_down == 1\n'
              ),
              '    require(scroll.status == 422 and error_code(scroll) == "scroll_too_large", "scroll limit was not explicit")\n\n': (
                  '    require(scroll.status == 422 and error_code(scroll) == "scroll_too_large", "scroll limit was not explicit")\n'
                  '    horizontal = post_json(\n'
                  '        harness,\n'
                  '        "/v1/pointer/scroll",\n'
                  '        {"x": 1, "y": 1, "delta_x": 1, "delta_y": 0},\n'
                  '    )\n'
                  '    require(\n'
                  '        horizontal.status == 422 and error_code(horizontal) == "invalid_request",\n'
                  '        "unsupported horizontal scrolling was not rejected explicitly",\n'
                  '    )\n\n'
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one R13 assertion block, found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          contract = Path('tests/test_integration_contract.py')
          tests = contract.read_text(encoding='utf-8')
          old = '            "scroll_too_large",\n'
          new = '            "scroll_too_large",\n            "unsupported horizontal scrolling was not rejected explicitly",\n'
          if tests.count(old) != 1:
              raise SystemExit('R13 contract scroll marker was not unique')
          contract.write_text(tests.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          python3 -m compileall -q tests/integration tests/test_integration_contract.py
          python3 -m unittest tests.test_integration_contract -v
          git diff --check

      - name: Run full real-Compose R13 suite
        env:
          R13_FAILURE_ARTIFACT_DIR: artifacts/r13-final-assertion-failure
        run: bash tests/integration/run.sh

      - name: Commit validated repair and assertions directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add \
            crates/controller-api/src/api_contract.rs \
            tests/integration/r13_integration.py \
            tests/test_integration_contract.py
          git commit -m 'fix: reject horizontal scrolling explicitly'
          git push origin HEAD:master
