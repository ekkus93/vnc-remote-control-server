name: Repair Deterministic R13 Reset Predicate

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r13-reset-predicate-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Match reset command and release ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/r13_integration.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '    click_control("reset")\n'
              '    harness.wait_desktop_state(\n'
              '        lambda value: value.get("text") == ""\n'
              '        and value.get("events") == []\n'
              '        and value.get("clipboard_revision") == 0\n'
              '    )\n'
          )
          new = (
              '    reset_point = controls["reset"]\n'
              '    click_control("reset")\n'
              '    harness.wait_desktop_state(\n'
              '        lambda value: value.get("text") == ""\n'
              '        and value.get("counter") == 0\n'
              '        and value.get("clipboard_revision") == 0\n'
              '        and value.get("keys_down") == []\n'
              '        and all(\n'
              '            event.get("type") == "button_up"\n'
              '            and event.get("button") == "left"\n'
              '            and event.get("x") == int(reset_point["x"])\n'
              '            and event.get("y") == int(reset_point["y"])\n'
              '            for event in value.get("events", [])\n'
              '        )\n'
              '    )\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one reset predicate, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile tests/integration/r13_integration.py
          python3 -m unittest tests.test_integration_contract -v
          git diff --check

      - name: Commit repair directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add tests/integration/r13_integration.py
          git commit -m 'test: match deterministic reset release ordering'
          git push origin HEAD:master
