name: Finalize R13 Checklist Evidence

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/finalize-r13-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Complete only the R13 checklist section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo_path = Path('docs/VNC_REMOTE_CONTROL_SERVER_REBASE_TODO_2026-08-03.md')
          text = todo_path.read_text(encoding='utf-8')
          start_marker = '## R13 — Integration and E2E validation\n'
          end_marker = '## R14 — CI hardening and security policy\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('R13/R14 section markers were not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          section = text[start:end]
          section = section.replace('- [ ]', '- [x]')

          evidence_start_marker = 'Evidence:\n\n```text\n'
          evidence_start = section.index(evidence_start_marker) + len(evidence_start_marker)
          evidence_end = section.index('```', evidence_start)
          evidence = (
              'Integration commit: 9323b09dcd0f13dbe0576a599926dd8b13d263b1\n'
              'Harness command: bash tests/integration/run.sh\n'
              'Connection tests: real Compose/TigerVNC auth failure, fail-closed secret, disconnect, reconnect, stale-frame invalidation, repeated restart/resource bounds\n'
              'Screenshot tests: 1280x800 PNG, coherent readiness, ETag/304, visible revision change, unavailable during reconnect, bounded concurrent encoding\n'
              'Input tests: exact pointer/button/double-click/vertical-scroll counts, explicit horizontal rejection, key/chord ordering, exact text and atomic unsupported-text rejection\n'
              'Clipboard tests: unavailable-before-first-update, API-to-desktop paste, desktop-to-API copy, revision/timestamp, oversized rejection\n'
              'Auth/abuse tests: all protected routes, WebSocket/query-token rejection, body/coordinate/scroll/queue/reconnect bounds, log and diagnostic redaction\n'
              'Shutdown tests: idle and queued SIGTERM, new-work rejection, worker connection close/thread join, bounded process exit, desktop child termination\n'
              'Evidence document: docs/VNC_REMOTE_CONTROL_SERVER_R13_EVIDENCE_2026-08-05.md\n'
              'R13 candidate run: 30973938130 (success)\n'
              'Final assertion/API validation run: 30993609334 (success)\n'
              'Temporary workflow cleanup commit: 039ac05828f75119b6177c36a91a85bc5c952bb0\n'
              'Final documentation SHA and ordinary CI: validated after this checklist commit\n'
          )
          section = section[:evidence_start] + evidence + section[evidence_end:]
          if '- [ ]' in section:
              raise SystemExit('R13 still contains unchecked items')
          text = text[:start] + section + text[end:]
          todo_path.write_text(text, encoding='utf-8')

          evidence_path = Path('docs/VNC_REMOTE_CONTROL_SERVER_R13_EVIDENCE_2026-08-05.md')
          if not evidence_path.is_file():
              raise SystemExit('R13 evidence document is missing')
          evidence_text = evidence_path.read_text(encoding='utf-8')
          for required in (
              '30973938130',
              '30993609334',
              '9323b09dcd0f13dbe0576a599926dd8b13d263b1',
              'silently discarded',
              'incremental framebuffer',
          ):
              if required not in evidence_text:
                  raise SystemExit(f'R13 evidence is missing {required!r}')
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/VNC_REMOTE_CONTROL_SERVER_REBASE_TODO_2026-08-03.md').read_text(encoding='utf-8')
          section = text.split('## R13 — Integration and E2E validation\n', 1)[1].split('## R14 — CI hardening and security policy\n', 1)[0]
          assert '- [ ]' not in section
          assert section.count('- [x]') >= 40
          assert '30993609334 (success)' in section
          PY

      - name: Commit R13 checklist completion directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add docs/VNC_REMOTE_CONTROL_SERVER_REBASE_TODO_2026-08-03.md
          git commit -m 'docs: complete R13 integration checklist'
          git push origin HEAD:master
