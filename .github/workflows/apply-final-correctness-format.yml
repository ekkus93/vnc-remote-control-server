name: Apply final correctness formatting pass

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-final-correctness-format.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Format correctness implementation
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-final-correctness-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Format final correctness regressions"
          git push origin HEAD:master
