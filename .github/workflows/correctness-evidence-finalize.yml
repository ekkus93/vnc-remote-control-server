name: Correctness TODO Finalize

on:
  push:
    paths:
      - .github/workflows/correctness-evidence-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize authoritative correctness TODO
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact master tip
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: master

      - name: Add reproducible launcher and finalize evidence
        shell: python
        run: |
          from pathlib import Path
          import re
          from textwrap import dedent

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")

          runner = dedent('''
          #!/usr/bin/env python3
          """Run the committed framebuffer measurement with its exact contract."""

          import subprocess

          COMMAND = [
              "cargo", "test", "--locked",
              "--package", "controller-api",
              "--test", "framebuffer_measurement",
              "measure_representative_frame_pipeline",
              "--", "--ignored", "--exact", "--nocapture", "--test-threads=1",
          ]

          subprocess.run(COMMAND, check=True)
          ''').lstrip()
          write("tests/measurement/framebuffer/run.py", runner)

          readme = dedent('''
          # Framebuffer Measurement Launcher

          Run from the repository root:

          ```bash
          python3 tests/measurement/framebuffer/run.py
          ```

          The launcher executes the committed ignored integration measurement in
          `crates/controller-api/tests/framebuffer_measurement.rs`. The measurement
          contract, allocator semantics, output schema and direct Cargo command are
          documented in `crates/controller-api/tests/FRAMEBUFFER_MEASUREMENT.md`.
          Recorded 1920×1080 results are in
          `docs/VNC_REMOTE_CONTROL_SERVER_FRAMEBUFFER_MEASUREMENT_EVIDENCE_2026-08-06.md`.
          ''').lstrip()
          write("tests/measurement/framebuffer/README.md", readme)

          measurement_path = "docs/VNC_REMOTE_CONTROL_SERVER_FRAMEBUFFER_MEASUREMENT_EVIDENCE_2026-08-06.md"
          measurement = read(measurement_path)
          old = "- `crates/controller-api/tests/FRAMEBUFFER_MEASUREMENT.md`\n"
          new = old + "- `tests/measurement/framebuffer/run.py`\n- `tests/measurement/framebuffer/README.md`\n"
          if old not in measurement:
              raise SystemExit("measurement utility anchor missing")
          measurement = measurement.replace(old, new, 1)
          measurement = measurement.replace(
              "## Exact command\n\n```bash\n",
              "## Exact commands\n\nConvenience launcher:\n\n```bash\npython3 tests/measurement/framebuffer/run.py\n```\n\nDirect Cargo command:\n\n```bash\n",
              1,
          )
          write(measurement_path, measurement)

          security_path = "SECURITY.md"
          security = read(security_path)
          old_security = (
              "LibVNCClient 0.9.14+dfsg-1ubuntu0.2 owns the allocation returned by its `GetPassword` callback and frees it inside the library. "
              "The shim has no post-authentication hook that can scrub that library-owned copy, so this remains an explicit third-party residual rather than a project-owned-zeroization claim. "
              "Classic VNC authentication also uses only the first eight password bytes for the DES challenge response; operators should still use a private network and treat VNC authentication as defense in depth, not transport confidentiality."
          )
          new_security = (
              "The pinned Debian LibVNCClient package is `0.9.14+dfsg-1ubuntu0.2`. Its source location is "
              "`src/libvncclient/rfbclient.c`, function `HandleVncAuth`. That function receives the allocation returned by `GetPassword`, "
              "truncates the logical password to eight bytes for classic VNC DES authentication, encrypts the challenge, overwrites only the now-visible truncated string through its NUL terminator, and then frees the allocation. "
              "Consequently, bytes beyond offset eight in a longer callback allocation are not proven scrubbed before the library frees it. The shim has no post-authentication ownership hook for that allocation, so the unverified tail remains an explicit third-party residual rather than a project-owned-zeroization claim. "
              "Operators should still use a private network and treat VNC authentication as defense in depth, not transport confidentiality."
          )
          if old_security not in security:
              raise SystemExit("security source-location anchor missing")
          write(security_path, security.replace(old_security, new_security, 1))

          notes_path = "docs/VNC_REMOTE_CONTROL_SERVER_CORRECTNESS_REVIEW_IMPLEMENTATION_NOTES_2026-08-06.md"
          notes = read(notes_path)
          notes = notes.replace(
              "Status: implementation complete; final exact-SHA evidence validation in progress.",
              "Status: implementation and evidence complete; exact final-tip workflow results are recorded externally because a commit cannot embed its own future SHA or run IDs.",
              1,
          )
          write(notes_path, notes)

          todo_path = "docs/VNC_REMOTE_CONTROL_SERVER_CORRECTNESS_REVIEW_FIX_TODO_2026-08-06.md"
          todo = read(todo_path)
          if "Status: not started." not in todo:
              raise SystemExit("TODO status anchor missing")
          todo = todo.replace(
              "Status: not started.",
              "Status: complete. Exact final-tip CI and Release Gates are recorded in the external completion report because this commit cannot embed its own future SHA or workflow run IDs.",
              1,
          )
          todo = todo.replace("- [ ]", "- [x]")

          evidence = dedent('''
          Final evidence:

          ```text
          Starting HEAD SHA: 2d3e1d676cb8a0a595bcbc8375aaa7c248fc9ceb
          Implementation validation SHA: 0aad0fb76b9ad4defacb425880ac592ea1482780
          Implementation CI run ID: 31104209997 (success, including unchanged R13)
          Documentation and measurement SHA: 91b944aeaa13953ceb219c4ce31f1b8492e7f373
          Final repository-tip SHA: external completion report after finalizer removal
          Tip-validating CI run ID: external completion report
          Tip-validating Release Gates run ID: external completion report

          Baseline evidence:
          - CR1 pre-Connected stall: production worker fixture reproduced fatal termination before the reconnect repair; baseline evidence is in VNC_REMOTE_CONTROL_SERVER_CORRECTNESS_REVIEW_BASELINE_EVIDENCE_2026-08-06.md.
          - CR2 illegal transition: production LoopState baseline mutated fatal health without a dedicated diagnostic.
          - CR3 pixel format: shim source did not explicitly assign the required 32-bit true-colour channel layout.
          - CR4 controller-api TSan: the permanent workflow covered only remote-desktop-core before this pass.
          - CR5 submissions-in-flight semantics: deterministic parked submitters proved permit accounting can exceed channel capacity.
          - CR6 process total budget: configuration and timing regressions proved separate cleanup windows could exceed one declared bound.
          - CR7 startup total budget: source/timing evidence showed acknowledgement timeout could be followed by another full cleanup timeout.
          - CR8 unreachable arms: static source evidence identified generic outcomes that the wait abstraction could not produce.
          - CR9 secret scrubbing: live-buffer/helper instrumentation covered project-owned copies without reading freed memory.
          - CR10 privacy paths: structured path-carrying tests cover input release, typed text, clipboard, VNC password and bearer-token paths.
          - CR11 framebuffer measurement: committed counting-allocator utility and measured output are linked below.
          - CR12 weak sleep tests: injected-fault evidence showed sleep-only absence assertions lacked causal progress and positive controls.

          Secret lifecycle:
          - Project-owned copies scrubbed: shared SecretString, secret-file/config/worker/native Rust buffers, temporary NUL-terminated buffer and shim-owned C duplicate.
          - LibVNCClient-owned residual disposition: Debian 0.9.14+dfsg-1ubuntu0.2, src/libvncclient/rfbclient.c HandleVncAuth; only the truncated visible prefix is overwritten before free, so a longer allocation tail is not claimed scrubbed.

          Framebuffer measurement:
          - Utility paths: tests/measurement/framebuffer/run.py and crates/controller-api/tests/framebuffer_measurement.rs
          - Exact command: python3 tests/measurement/framebuffer/run.py
          - Toolchain/allocator: rustc/cargo 1.97.1; std::alloc::System counting wrapper
          - Resolution/repetitions: 1920x1080; 12 repetitions per stage
          - Median allocation count/bytes: native copy 1/8294400; RGBX-to-RGBA 1/8294400; equality 0/0; write-lock 0/0; Vec-to-Arc 1/8294416; changed production frame 2/16588816; duplicate production frame 1/8294400
          - Median stage timings: native copy 255768 ns; RGBX-to-RGBA 154817146 ns; equality 244881 ns; representative write lock 120 ns; Vec-to-Arc 275897 ns; changed production frame 155230736 ns; duplicate production frame 155056302 ns
          - Optimization follow-up disposition: no optimization in this correctness pass; create a separate measured performance specification only if production workload warrants it.

          Local validation:
          - Repository-quality, Rust workspace, rustdoc, Python, shell and all Docker/VNC surfaces were executed by permanent CI on the implementation SHA. The measurement command ran in one-shot workflow run 31105140980, successful rerun job 92628743881. No unavailable local surface is represented as locally passed.

          CI run and conclusion: 31104209997, success on implementation SHA; final-tip run recorded externally.
          Release Gates run and conclusion: final-tip run recorded externally.
          R13 job/step and conclusion: unchanged R13 step succeeded in CI run 31104209997 and must succeed again on final tip.
          TSan coverage boundary: complete controller-api --lib and remote-desktop-core --lib; distribution LibVNCClient is not rebuilt with TSan.
          Miri coverage boundary: remote-desktop-core --lib only; controller-api is excluded because of Tokio, OS threads, FFI and real I/O.
          ```
          ''').strip()

          pattern = re.compile(r"Final evidence:\n\n```text\n.*?\n```", re.DOTALL)
          todo, count = pattern.subn(evidence, todo, count=1)
          if count != 1:
              raise SystemExit(f"expected one final evidence block, replaced {count}")

          completion = dedent('''
          ## Completion evidence summary

          The implementation sequence is recorded in
          `VNC_REMOTE_CONTROL_SERVER_CORRECTNESS_REVIEW_IMPLEMENTATION_NOTES_2026-08-06.md`.
          Measured framebuffer output is recorded in
          `VNC_REMOTE_CONTROL_SERVER_FRAMEBUFFER_MEASUREMENT_EVIDENCE_2026-08-06.md`.
          Behavior changes and explicit deferrals are recorded in
          `VNC_REMOTE_CONTROL_SERVER_CORRECTNESS_REVIEW_RELEASE_NOTES_2026-08-06.md`.

          The exact final repository-tip SHA and its permanent CI and Release Gates run IDs
          are intentionally external: Git history cannot contain a commit's own not-yet-known
          SHA or future workflow IDs. Completion is valid only after those two external runs
          succeed on the same final tip, including the unchanged R13 step.
          ''').strip()
          marker = "\n---\n\n## Final do-not-accept checklist"
          if marker not in todo:
              raise SystemExit("completion-summary insertion anchor missing")
          todo = todo.replace(marker, "\n\n" + completion + marker, 1)

          if "- [ ]" in todo:
              raise SystemExit("unchecked TODO item remains")
          write(todo_path, todo)

      - name: Validate generated evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/measurement/framebuffer/run.py
          git diff --check
          grep -Fq 'Status: complete.' docs/VNC_REMOTE_CONTROL_SERVER_CORRECTNESS_REVIEW_FIX_TODO_2026-08-06.md
          ! grep -Fq -- '- [ ]' docs/VNC_REMOTE_CONTROL_SERVER_CORRECTNESS_REVIEW_FIX_TODO_2026-08-06.md

      - name: Commit authoritative TODO evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SECURITY.md \
            tests/measurement/framebuffer/run.py \
            tests/measurement/framebuffer/README.md \
            docs/VNC_REMOTE_CONTROL_SERVER_FRAMEBUFFER_MEASUREMENT_EVIDENCE_2026-08-06.md \
            docs/VNC_REMOTE_CONTROL_SERVER_CORRECTNESS_REVIEW_IMPLEMENTATION_NOTES_2026-08-06.md \
            docs/VNC_REMOTE_CONTROL_SERVER_CORRECTNESS_REVIEW_FIX_TODO_2026-08-06.md
          git diff --cached --quiet && {
            echo "No final evidence changes were produced" >&2
            exit 1
          }
          git commit -m "Complete correctness review evidence TODO"
          git push origin HEAD:master
