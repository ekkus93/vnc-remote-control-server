name: Complete R12 Retry

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/complete-r12-v2.yml

permissions:
  contents: write

concurrency:
  group: complete-r12-v2-master
  cancel-in-progress: false

jobs:
  complete-r12:
    name: Complete R12 retry on master
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Install native and integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 600 apt-get -o Acquire::Retries=3 update
          sudo timeout 600 apt-get \
            -o Acquire::Retries=3 \
            -o DPkg::Lock::Timeout=120 \
            install --yes --no-install-recommends \
              build-essential \
              libvncserver-dev \
              pkg-config \
              tigervnc-tools \
              tigervnc-viewer \
              xvfb

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Reconstruct and apply R12 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/r12_payload_*.b64 > /tmp/r12_apply.py.xz.b64
          echo 'f9e879b0566bb3827a58ea129d39ec5199ecc9d9b64934c9142065cc6e3cb733  /tmp/r12_apply.py.xz.b64' | sha256sum --check --strict
          base64 --decode /tmp/r12_apply.py.xz.b64 | xz --decompress > /tmp/r12_apply.py
          echo '536cb06f9cf3cda2a015beac239fd7805a46613aed6b67ab96911bbd2388906e  /tmp/r12_apply.py' | sha256sum --check --strict
          python3 -m py_compile /tmp/r12_apply.py
          python3 /tmp/r12_apply.py
          python3 - <<'PYFIX'
          from pathlib import Path

          desktop_test = Path("tests/desktop/run.sh")
          text = desktop_test.read_text(encoding="utf-8")
          old = '[[ "$(docker exec "$container_name" stat -c \'%a\' /home/desktop/.vnc/passwd)" == "600" ]] || fail "encoded VNC password permissions are not 0600"'
          new = '[[ "$(docker exec "$container_name" stat -c \'%a\' /tmp/vnc-runtime/passwd)" == "600" ]] || fail "encoded VNC password permissions are not 0600"\ndocker exec "$container_name" test ! -e /home/desktop/.vnc/passwd || fail "generated VNC password was written into persistent home"'
          if text.count(old) != 1:
              raise SystemExit("desktop smoke credential-path patch did not match exactly once")
          desktop_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          compose_path = Path("deploy/compose.yaml")
          compose_text = compose_path.read_text(encoding="utf-8")
          old_build = """    build:\n      context: ..\n      dockerfile: desktop/Dockerfile\n"""
          new_build = """    build:\n      context: ../desktop\n      dockerfile: Dockerfile\n"""
          if compose_text.count(old_build) != 1:
              raise SystemExit("deploy/compose.yaml desktop build patch did not match exactly once")
          compose_path.write_text(compose_text.replace(old_build, new_build, 1), encoding="utf-8")

          compose_smoke = Path("tests/compose/run.sh")
          compose_smoke_text = compose_smoke.read_text(encoding="utf-8")
          old_secret_mode = 'chmod 0600 "$api_secret" "$vnc_secret"\n'
          new_secret_mode = '''# Local Compose implements file-backed secrets as read-only bind mounts and
          # preserves the host file owner. Keep the containing directory private while
          # making each mounted file readable by the non-root service UID.
          chmod 0700 "$temp_dir"
          chmod 0444 "$api_secret" "$vnc_secret"
          '''
          if compose_smoke_text.count(old_secret_mode) != 1:
              raise SystemExit("Compose smoke secret-mode patch did not match exactly once")
          compose_smoke_text = compose_smoke_text.replace(
              old_secret_mode,
              new_secret_mode,
              1,
          )
          first_base_up = '''"${base[@]}" up --detach
          wait_healthy base desktop
          '''
          diagnosed_base_up = '''if ! "${base[@]}" up --detach; then
              "${base[@]}" ps --all >&2 || true
              "${base[@]}" logs --no-color >&2 || true
              fail "production stack failed before health checks"
          fi
          wait_healthy base desktop
          '''
          if compose_smoke_text.count(first_base_up) < 1:
              raise SystemExit("Compose startup diagnostic patch did not find the base startup")
          compose_smoke.write_text(
              compose_smoke_text.replace(first_base_up, diagnosed_base_up, 1),
              encoding="utf-8",
          )

          deploy_readme = Path("deploy/README.md")
          deploy_text = deploy_readme.read_text(encoding="utf-8")
          old_readme_mode = 'chmod 0600 deploy/secrets/api_token.txt deploy/secrets/vnc_password.txt'
          new_readme_mode = 'chmod 0700 deploy/secrets\nchmod 0444 deploy/secrets/api_token.txt deploy/secrets/vnc_password.txt'
          if deploy_text.count(old_readme_mode) != 1:
              raise SystemExit("deployment README secret-mode patch did not match exactly once")
          old_readme_explanation = (
              'The secret directory ignores all credential files. The controller reads both '
              'credentials from `/run/secrets`; the desktop reads the VNC password from '
              '`/run/secrets`. The generated TigerVNC credential file is stored only in '
              '`/tmp/vnc-runtime/passwd`, never under the persistent home directory.'
          )
          new_readme_explanation = (
              'The secret directory ignores all credential files. Keep the directory at mode '
              '`0700`; the files use mode `0444` because local Docker Compose mounts file-backed '
              'secrets read-only while preserving their host ownership, and both services run as '
              'dedicated non-root UIDs. The private parent directory prevents other host users from '
              'traversing to the files. The controller reads both credentials from `/run/secrets`; '
              'the desktop reads the VNC password from `/run/secrets`. The generated TigerVNC '
              'credential file is stored only in `/tmp/vnc-runtime/passwd`, never under the '
              'persistent home directory.'
          )
          if deploy_text.count(old_readme_explanation) != 1:
              raise SystemExit("deployment README explanation patch did not match exactly once")
          deploy_readme.write_text(
              deploy_text.replace(old_readme_mode, new_readme_mode, 1).replace(
                  old_readme_explanation,
                  new_readme_explanation,
                  1,
              ),
              encoding="utf-8",
          )

          secrets_readme = Path("deploy/secrets/README.md")
          secrets_text = secrets_readme.read_text(encoding="utf-8")
          old_secrets_text = (
              'Place `api_token.txt` and `vnc_password.txt` here with mode `0600`. '
              'Their contents are intentionally ignored by Git. Never commit real credentials.'
          )
          new_secrets_text = (
              'Keep this directory at mode `0700`. Place `api_token.txt` and '
              '`vnc_password.txt` here with mode `0444`; local Docker Compose mounts them '
              'read-only while preserving host ownership, so the dedicated non-root service '
              'UIDs require the read bits. Their contents are intentionally ignored by Git. '
              'Never commit real credentials.'
          )
          if secrets_text.count(old_secrets_text) != 1:
              raise SystemExit("secrets README mode patch did not match exactly once")
          secrets_readme.write_text(
              secrets_text.replace(old_secrets_text, new_secrets_text, 1),
              encoding="utf-8",
          )
          PYFIX

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run workspace tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Run Clippy with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build rustdoc with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Run Python and workflow contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/ci_status tests desktop/test-app
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check first-party shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.sh' -o -name xstartup \) -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

      - name: Run desktop smoke
        run: bash tests/desktop/run.sh

      - name: Run native adapter smoke
        run: bash tests/native/run.sh

      - name: Run WorkerHandle input E2E
        run: bash tests/worker-e2e/run.sh

      - name: Run WorkerHandle text and clipboard E2E
        run: bash tests/worker-text-clipboard-e2e/run.sh

      - name: Run authenticated HTTP and WebSocket E2E
        run: bash tests/http-e2e/run.sh

      - name: Run controller image, Compose, and persistence smoke
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/r12-compose-diagnostics
          bash -x tests/compose/run.sh 2>&1 \
            | tee /tmp/r12-compose-diagnostics/compose-trace.log

      - name: Upload Compose failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r12-compose-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/r12-compose-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated R12 directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/r12_payload_*.b64 .github/workflows/complete-r12*.yml
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete R12 controller image Compose and persistence'
          git push origin HEAD:master
