name: Complete R12 Retry

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/complete-r12-v2.yml

permissions:
  contents: write

concurrency:
  group: complete-r12-v2-master
  cancel-in-progress: false

jobs:
  complete-r12:
    name: Complete R12 retry on master
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Install native and integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 600 apt-get -o Acquire::Retries=3 update
          sudo timeout 600 apt-get \
            -o Acquire::Retries=3 \
            -o DPkg::Lock::Timeout=120 \
            install --yes --no-install-recommends \
              build-essential \
              libvncserver-dev \
              pkg-config \
              tigervnc-tools \
              tigervnc-viewer \
              xvfb

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Reconstruct and apply R12 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/r12_payload_*.b64 > /tmp/r12_apply.py.xz.b64
          echo 'f9e879b0566bb3827a58ea129d39ec5199ecc9d9b64934c9142065cc6e3cb733  /tmp/r12_apply.py.xz.b64' | sha256sum --check --strict
          base64 --decode /tmp/r12_apply.py.xz.b64 | xz --decompress > /tmp/r12_apply.py
          echo '536cb06f9cf3cda2a015beac239fd7805a46613aed6b67ab96911bbd2388906e  /tmp/r12_apply.py' | sha256sum --check --strict
          python3 -m py_compile /tmp/r12_apply.py
          python3 /tmp/r12_apply.py
          python3 - <<'PYFIX'
          from pathlib import Path

          desktop_test = Path("tests/desktop/run.sh")
          text = desktop_test.read_text(encoding="utf-8")
          old = '[[ "$(docker exec "$container_name" stat -c \'%a\' /home/desktop/.vnc/passwd)" == "600" ]] || fail "encoded VNC password permissions are not 0600"'
          new = '[[ "$(docker exec "$container_name" stat -c \'%a\' /tmp/vnc-runtime/passwd)" == "600" ]] || fail "encoded VNC password permissions are not 0600"\ndocker exec "$container_name" test ! -e /home/desktop/.vnc/passwd || fail "generated VNC password was written into persistent home"'
          if text.count(old) != 1:
              raise SystemExit("desktop smoke credential-path patch did not match exactly once")
          desktop_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          compose_targets = []
          for path in sorted(Path(".").rglob("*.y*ml")):
              if ".git" in path.parts or ".github" in path.parts:
                  continue
              candidate = path.read_text(encoding="utf-8")
              if "desktop/Dockerfile" in candidate and "desktop:" in candidate:
                  compose_targets.append((path, candidate))
          if len(compose_targets) != 1:
              names = ", ".join(str(path) for path, _ in compose_targets)
              raise SystemExit(f"expected one Compose desktop build target, found {len(compose_targets)}: {names}")

          compose_path, compose_text = compose_targets[0]
          lines = compose_text.splitlines(keepends=True)
          service_index = next(
              (index for index, line in enumerate(lines) if line.strip() == "desktop:"),
              None,
          )
          if service_index is None:
              raise SystemExit(f"{compose_path}: desktop service not found")
          service_indent = len(lines[service_index]) - len(lines[service_index].lstrip())
          service_end = len(lines)
          for index in range(service_index + 1, len(lines)):
              stripped = lines[index].strip()
              indent = len(lines[index]) - len(lines[index].lstrip())
              if stripped and not stripped.startswith("#") and indent == service_indent and stripped.endswith(":"):
                  service_end = index
                  break

          context_indexes = []
          dockerfile_indexes = []
          for index in range(service_index + 1, service_end):
              stripped = lines[index].strip()
              if stripped.startswith("context:"):
                  context_indexes.append(index)
              elif stripped.startswith("dockerfile:"):
                  dockerfile_indexes.append(index)
          if len(context_indexes) != 1 or len(dockerfile_indexes) != 1:
              raise SystemExit(
                  f"{compose_path}: expected one desktop context and dockerfile, found "
                  f"{len(context_indexes)} and {len(dockerfile_indexes)}"
              )

          context_index = context_indexes[0]
          dockerfile_index = dockerfile_indexes[0]
          context_value = lines[context_index].split(":", 1)[1].split("#", 1)[0].strip().strip("'\"")
          dockerfile_value = lines[dockerfile_index].split(":", 1)[1].split("#", 1)[0].strip().strip("'\"")
          if context_value != "." or dockerfile_value not in {"desktop/Dockerfile", "./desktop/Dockerfile"}:
              raise SystemExit(
                  f"{compose_path}: unexpected desktop build values "
                  f"context={context_value!r} dockerfile={dockerfile_value!r}"
              )
          context_indent = lines[context_index][: len(lines[context_index]) - len(lines[context_index].lstrip())]
          dockerfile_indent = lines[dockerfile_index][: len(lines[dockerfile_index]) - len(lines[dockerfile_index].lstrip())]
          lines[context_index] = f"{context_indent}context: ./desktop\n"
          lines[dockerfile_index] = f"{dockerfile_indent}dockerfile: Dockerfile\n"
          compose_path.write_text("".join(lines), encoding="utf-8")
          PYFIX

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run workspace tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Run Clippy with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build rustdoc with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Run Python and workflow contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/ci_status tests desktop/test-app
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check first-party shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.sh' -o -name xstartup \) -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

      - name: Run desktop smoke
        run: bash tests/desktop/run.sh

      - name: Run native adapter smoke
        run: bash tests/native/run.sh

      - name: Run WorkerHandle input E2E
        run: bash tests/worker-e2e/run.sh

      - name: Run WorkerHandle text and clipboard E2E
        run: bash tests/worker-text-clipboard-e2e/run.sh

      - name: Run authenticated HTTP and WebSocket E2E
        run: bash tests/http-e2e/run.sh

      - name: Run controller image, Compose, and persistence smoke
        run: bash tests/compose/run.sh

      - name: Commit validated R12 directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/r12_payload_*.b64 .github/workflows/complete-r12*.yml
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete R12 controller image Compose and persistence'
          git push origin HEAD:master
