name: Apply correctness metric refactor

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-correctness-metric-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply metric rename and metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('crates/controller-api/src')
          for path in root.rglob('*.rs'):
              text = path.read_text()
              text = text.replace('command_queue_depth', 'command_submissions_in_flight')
              text = text.replace('vrc_worker_command_queue_depth', 'vrc_worker_command_submissions_in_flight')
              text = text.replace('release_queue_depth', 'release_submission')
              path.write_text(text)

          path = Path('crates/controller-api/src/observability.rs')
          text = path.read_text()
          marker = '        let mut output = String::new();\n'
          replacement = '        let mut output = String::new();\n        render_metadata(&mut output);\n'
          if text.count(marker) != 1:
              raise SystemExit('render output marker mismatch')
          text = text.replace(marker, replacement, 1)

          function_marker = '''fn metric(output: &mut String, name: &str, value: u64) {
'''
          metadata = r'''fn render_metadata(output: &mut String) {
    const METRICS: &[(&str, &str, &str)] = &[
        ("vrc_connection_state", "Current worker connection state as a one-hot gauge.", "gauge"),
        ("vrc_worker_last_failure", "Last bounded worker failure category as a one-hot gauge.", "gauge"),
        ("vrc_http_requests_total", "Completed HTTP requests.", "counter"),
        ("vrc_http_errors_total", "Completed HTTP requests with status 400 or greater.", "counter"),
        ("vrc_auth_failures_total", "Rejected authentication attempts.", "counter"),
        ("vrc_commands_total", "Accepted command attempts by bounded command kind.", "counter"),
        ("vrc_command_errors_total", "Worker command failures.", "counter"),
        ("vrc_command_timeouts_total", "Worker command timeout failures.", "counter"),
        ("vrc_worker_command_submissions_in_flight", "Command submissions whose ownership permit remains live; this can transiently exceed queue capacity before try_send.", "gauge"),
        ("vrc_worker_command_queue_capacity", "Configured bounded worker command channel capacity.", "gauge"),
        ("vrc_worker_rejected_commands_total", "Commands rejected because the bounded channel was full.", "counter"),
        ("vrc_worker_dropped_events_total", "Worker events dropped because the bounded event channel was full.", "counter"),
        ("vrc_worker_reconnect_attempts", "Current consecutive reconnect attempt count.", "gauge"),
        ("vrc_framebuffer_revision", "Current canonical framebuffer revision, or zero when unavailable.", "gauge"),
        ("vrc_screenshot_requests_total", "Screenshot requests started.", "counter"),
        ("vrc_screenshot_success_total", "PNG screenshot responses completed.", "counter"),
        ("vrc_screenshot_not_modified_total", "Conditional screenshot requests answered with not modified.", "counter"),
        ("vrc_screenshot_busy_total", "Screenshot requests rejected by bounded concurrency.", "counter"),
        ("vrc_screenshot_timeouts_total", "Screenshot encoding timeouts.", "counter"),
        ("vrc_screenshot_failures_total", "Other screenshot failures.", "counter"),
        ("vrc_screenshot_duration_milliseconds_total", "Cumulative screenshot processing duration in milliseconds.", "counter"),
        ("vrc_websocket_clients", "Current authenticated WebSocket clients.", "gauge"),
        ("vrc_websocket_rejected_total", "WebSocket clients rejected at capacity.", "counter"),
        ("vrc_websocket_slow_disconnects_total", "WebSocket clients disconnected after falling behind.", "counter"),
        ("vrc_websocket_idle_disconnects_total", "WebSocket clients disconnected by heartbeat timeout.", "counter"),
        ("vrc_events_total", "Payload-free worker events by bounded type.", "counter"),
        ("vrc_reconnect_events_total", "Worker reconnecting state events.", "counter"),
        ("vrc_protocol_errors_total", "Observed protocol errors.", "counter"),
    ];
    for (name, help, metric_type) in METRICS {
        let _ = writeln!(output, "# HELP {name} {help}");
        let _ = writeln!(output, "# TYPE {name} {metric_type}");
    }
}

fn metric(output: &mut String, name: &str, value: u64) {
'''
          if text.count(function_marker) != 1:
              raise SystemExit('metric function marker mismatch')
          text = text.replace(function_marker, metadata, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          ! grep -R 'vrc_worker_command_queue_depth\|command_queue_depth\|release_queue_depth' crates/controller-api/src
          grep -q '# HELP' crates/controller-api/src/observability.rs
          grep -q 'vrc_worker_command_submissions_in_flight' crates/controller-api/src/observability.rs
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-correctness-metric-refactor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/controller-api/src .github/workflows/apply-correctness-metric-refactor.yml
          git commit -m "Complete command submission metric semantics"
          git push origin HEAD:master
