name: PFH Rustfmt Fix

on:
  push:
    branches:
      - ralph/post-fcr-hardening-implementation-20260914

permissions:
  contents: write

jobs:
  format-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Run rustfmt and remove temporary workflow
        run: |
          set -euo pipefail
          cargo fmt --all
          rm -f .github/workflows/pfh-rustfmt-fix.yml
          git add crates/controller-api/src/config.rs .github/workflows/pfh-rustfmt-fix.yml
          if git diff --cached --quiet; then
            echo 'no formatting changes required'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'chatgpt-ralph-bridge[bot]'
          git config user.email '326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com'
          git commit -m 'style: format post-FCR Rust changes'
          git push origin HEAD:ralph/post-fcr-hardening-implementation-20260914
