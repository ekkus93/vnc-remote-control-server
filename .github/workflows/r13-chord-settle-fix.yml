name: Apply R13 Chord Settling Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r13-chord-settle-fix.yml

permissions:
  contents: write

concurrency:
  group: r13-chord-settle-fix-master
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Add bounded modifier-chord settling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/controller-api/src/input.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "const WHEEL_UP_MASK: u8 = 1 << 3;\nconst WHEEL_DOWN_MASK: u8 = 1 << 4;\n": (
                  "const WHEEL_UP_MASK: u8 = 1 << 3;\n"
                  "const WHEEL_DOWN_MASK: u8 = 1 << 4;\n"
                  "// TigerVNC feeds RFB key messages into the X input queue asynchronously.\n"
                  "// A short bounded interval preserves modifier transition order without\n"
                  "// allowing another worker command to interleave with the chord.\n"
                  "const CHORD_EVENT_SETTLE_INTERVAL: Duration = Duration::from_millis(5);\n"
              ),
              "    /// Presses keys in order and releases newly pressed keys in reverse order.\n": (
                  "    /// Presses keys in order and releases newly pressed keys in reverse order.\n"
                  "    ///\n"
                  "    /// Each native transition is separated by a small bounded interval so\n"
                  "    /// TigerVNC/X observes the same ordering that was written to the RFB stream.\n"
              ),
              (
                  "            self.pressed_keys.push(*key);\n"
                  "            newly_pressed.push(*key);\n"
                  "        }\n"
              ): (
                  "            self.pressed_keys.push(*key);\n"
                  "            newly_pressed.push(*key);\n"
                  "            thread::sleep(CHORD_EVENT_SETTLE_INTERVAL);\n"
                  "        }\n"
              ),
              (
                  "                Err(error) if first_error.is_none() => first_error = Some(error),\n"
                  "                Err(_) => {}\n"
                  "            }\n"
                  "        }\n"
              ): (
                  "                Err(error) if first_error.is_none() => first_error = Some(error),\n"
                  "                Err(_) => {}\n"
                  "            }\n"
                  "            thread::sleep(CHORD_EVENT_SETTLE_INTERVAL);\n"
                  "        }\n"
              ),
              (
                  "            if sink.send_key(*key, false).is_ok() {\n"
                  "                self.remove_pressed_key(*key);\n"
                  "            }\n"
                  "        }\n"
              ): (
                  "            if sink.send_key(*key, false).is_ok() {\n"
                  "                self.remove_pressed_key(*key);\n"
                  "            }\n"
                  "            thread::sleep(CHORD_EVENT_SETTLE_INTERVAL);\n"
                  "        }\n"
              ),
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one chord block, found {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all --check
          RUSTFLAGS=-Dwarnings cargo test --locked --workspace --all-features input::tests
          git diff --check

      - name: Commit repair directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add crates/controller-api/src/input.rs
          git commit -m 'fix: preserve real VNC chord transition order'
          git push origin HEAD:master
