name: Apply R16 Gate Fixes

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-r16-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-r16-gate-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Apply fail-closed gate fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "desktop/entrypoint.sh",
              'readonly home_dir="${HOME:-/home/desktop}"\n',
              "",
          )

          for path in ("tests/http-e2e/run.sh", "tests/compose/run.sh"):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if not text.startswith("\\\n#!/usr/bin/env bash\n"):
                  raise SystemExit(f"{path}: malformed leading backslash was not found")
              target.write_text(text[2:], encoding="utf-8")

          replace_once(
              "tests/compose/run.sh",
              'readonly root_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"\n',
              'root_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"\nreadonly root_dir\n',
          )
          replace_once(
              "tests/integration/run.sh",
              'readonly root_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"\n',
              'root_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"\nreadonly root_dir\n',
          )

          vex = r'''
          {
            "schema_version": 1,
            "reviewed_at": "2026-08-05",
            "expires_at": "2026-09-04",
            "tracking_issue": 7,
            "entries": [
              {
                "id": "CVE-2026-13221",
                "decision": "not_exploitable",
                "installed_version": "5.40.1-6",
                "packages": {
                  "controller": ["perl-base"],
                  "desktop": ["libperl5.40", "perl", "perl-base", "perl-modules-5.40"]
                },
                "rationale": "The shipped Rust controller, VNC adapter, desktop launcher, and deterministic test application do not invoke Perl or compile attacker-controlled Perl regular expressions. The vulnerable trie construction therefore has no reachable application input path.",
                "source": "https://security-tracker.debian.org/tracker/CVE-2026-13221"
              },
              {
                "id": "CVE-2026-42496",
                "decision": "not_exploitable",
                "installed_version": "5.40.1-6",
                "packages": {
                  "controller": ["perl-base"],
                  "desktop": ["libperl5.40", "perl", "perl-base", "perl-modules-5.40"]
                },
                "rationale": "No HTTP, WebSocket, LibVNCClient, startup, health-check, or deterministic desktop path extracts attacker-provided archives through Perl Archive::Tar. The vulnerable symlink extraction function is not reachable from service inputs.",
                "source": "https://security-tracker.debian.org/tracker/CVE-2026-42496"
              },
              {
                "id": "CVE-2026-57433",
                "decision": "not_exploitable",
                "installed_version": "5.40.1-6",
                "packages": {
                  "controller": ["perl-base"],
                  "desktop": ["libperl5.40", "perl", "perl-base", "perl-modules-5.40"]
                },
                "rationale": "The production services do not invoke Perl Storable and do not deserialize attacker-provided Storable records. The crafted SX_HOOK input required by the issue is absent from every exposed application path.",
                "source": "https://security-tracker.debian.org/tracker/CVE-2026-57433"
              },
              {
                "id": "CVE-2026-8376",
                "decision": "not_affected",
                "installed_version": "5.40.1-6",
                "packages": {
                  "controller": ["perl-base"],
                  "desktop": ["libperl5.40", "perl", "perl-base", "perl-modules-5.40"]
                },
                "rationale": "The vulnerability is limited to 32-bit Perl builds. Both release jobs build and inspect linux/amd64 images, so the affected integer-width condition is not present in the shipped artifacts.",
                "source": "https://security-tracker.debian.org/tracker/CVE-2026-8376"
              },
              {
                "id": "CVE-2026-58016",
                "decision": "not_exploitable",
                "installed_version": "2.84.4-3~deb13u3",
                "packages": {
                  "desktop": ["libglib2.0-0t64"]
                },
                "rationale": "No HTTP, WebSocket, LibVNCClient, startup, health-check, or deterministic desktop application input accepts D-Bus introspection XML. The malformed introspection document required for the GLib denial of service is not reachable from the remote-control API.",
                "source": "https://security-tracker.debian.org/tracker/CVE-2026-58016"
              },
              {
                "id": "CVE-2026-6653",
                "decision": "not_exploitable",
                "installed_version": "2.12.7+dfsg+really2.9.14-2.1+deb13u3",
                "packages": {
                  "desktop": ["libxml2"]
                },
                "rationale": "The controller, VNC adapter, startup scripts, and deterministic desktop application expose no XML input or libxml2 parsing operation. The crafted XML document required for the denial of service is not accepted by any service endpoint.",
                "source": "https://security-tracker.debian.org/tracker/CVE-2026-6653"
              }
            ]
          }
          '''
          vex_path = Path("security/trivy-critical-vex.json")
          vex_path.parent.mkdir(parents=True, exist_ok=True)
          vex_path.write_text(dedent(vex).lstrip(), encoding="utf-8")

          verifier = r'''#!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import json
          import sys
          from datetime import date
          from pathlib import Path
          from typing import Any

          Finding = tuple[str, str, str, str]


          def parse_date(value: str, field: str) -> date:
              try:
                  return date.fromisoformat(value)
              except ValueError as error:
                  raise ValueError(f"{field} must be an ISO-8601 date: {value!r}") from error


          def load_findings(paths: list[Path]) -> set[Finding]:
              findings: set[Finding] = set()
              for path in paths:
                  suffix = "-vulnerabilities.json"
                  if not path.name.endswith(suffix):
                      raise ValueError(f"report name must end with {suffix}: {path}")
                  image = path.name[: -len(suffix)]
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  for result in payload.get("Results") or []:
                      for vulnerability in result.get("Vulnerabilities") or []:
                          if vulnerability.get("Severity") != "CRITICAL":
                              continue
                          finding = (
                              image,
                              str(vulnerability.get("VulnerabilityID") or ""),
                              str(vulnerability.get("PkgName") or ""),
                              str(vulnerability.get("InstalledVersion") or ""),
                          )
                          if not all(finding):
                              raise ValueError(f"incomplete CRITICAL finding in {path}: {finding!r}")
                          findings.add(finding)
              return findings


          def load_vex(path: Path, today: date) -> tuple[set[Finding], dict[str, Any]]:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("schema_version") != 1:
                  raise ValueError("unsupported VEX schema_version")
              reviewed = parse_date(str(payload.get("reviewed_at") or ""), "reviewed_at")
              expires = parse_date(str(payload.get("expires_at") or ""), "expires_at")
              if expires < today:
                  raise ValueError(f"VEX expired on {expires.isoformat()}")
              if expires < reviewed or (expires - reviewed).days > 30:
                  raise ValueError("VEX validity window must be between 0 and 30 days")
              if not isinstance(payload.get("tracking_issue"), int):
                  raise ValueError("tracking_issue must be an integer")

              expected: set[Finding] = set()
              seen_ids: set[str] = set()
              for entry in payload.get("entries") or []:
                  cve = str(entry.get("id") or "")
                  if not cve.startswith("CVE-"):
                      raise ValueError(f"invalid vulnerability id: {cve!r}")
                  if cve in seen_ids:
                      raise ValueError(f"duplicate VEX entry: {cve}")
                  seen_ids.add(cve)
                  if entry.get("decision") not in {"not_affected", "not_exploitable"}:
                      raise ValueError(f"unsupported decision for {cve}")
                  rationale = str(entry.get("rationale") or "")
                  source = str(entry.get("source") or "")
                  version = str(entry.get("installed_version") or "")
                  if len(rationale) < 80:
                      raise ValueError(f"rationale is too short for {cve}")
                  if not source.startswith("https://security-tracker.debian.org/tracker/CVE-"):
                      raise ValueError(f"untrusted source for {cve}: {source!r}")
                  if not version:
                      raise ValueError(f"installed_version is required for {cve}")
                  packages = entry.get("packages")
                  if not isinstance(packages, dict) or not packages:
                      raise ValueError(f"packages are required for {cve}")
                  for image, names in packages.items():
                      if image not in {"controller", "desktop"}:
                          raise ValueError(f"unsupported image for {cve}: {image!r}")
                      if not isinstance(names, list) or not names:
                          raise ValueError(f"package list is empty for {cve}/{image}")
                      for package in names:
                          finding = (image, cve, str(package), version)
                          if finding in expected:
                              raise ValueError(f"duplicate exact VEX tuple: {finding!r}")
                          expected.add(finding)
              if not expected:
                  raise ValueError("VEX contains no exact findings")
              return expected, payload


          def main() -> int:
              parser = argparse.ArgumentParser(
                  description="Fail closed unless every CRITICAL Trivy finding has an exact, current VEX determination."
              )
              parser.add_argument("--vex", required=True, type=Path)
              parser.add_argument("--output", type=Path)
              parser.add_argument("--today", type=date.fromisoformat, default=date.today())
              parser.add_argument("reports", nargs="+", type=Path)
              args = parser.parse_args()

              try:
                  observed = load_findings(args.reports)
                  expected, vex = load_vex(args.vex, args.today)
              except (OSError, ValueError, json.JSONDecodeError) as error:
                  print(f"critical VEX validation error: {error}", file=sys.stderr)
                  return 2

              unreviewed = sorted(observed - expected)
              stale = sorted(expected - observed)
              result = {
                  "status": "passed" if not unreviewed and not stale else "failed",
                  "reviewed_at": vex["reviewed_at"],
                  "expires_at": vex["expires_at"],
                  "tracking_issue": vex["tracking_issue"],
                  "observed_critical_findings": len(observed),
                  "unreviewed": [list(item) for item in unreviewed],
                  "stale": [list(item) for item in stale],
              }
              if args.output is not None:
                  args.output.parent.mkdir(parents=True, exist_ok=True)
                  args.output.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
              if unreviewed:
                  print("unreviewed CRITICAL findings:", file=sys.stderr)
                  for item in unreviewed:
                      print("  " + " | ".join(item), file=sys.stderr)
              if stale:
                  print("stale or mismatched VEX tuples:", file=sys.stderr)
                  for item in stale:
                      print("  " + " | ".join(item), file=sys.stderr)
              if unreviewed or stale:
                  return 1
              print(
                  f"validated {len(observed)} exact CRITICAL finding tuples; "
                  f"VEX expires {vex['expires_at']} (tracking issue #{vex['tracking_issue']})"
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          verifier_path = Path("scripts/verify_trivy_critical_vex.py")
          verifier_path.parent.mkdir(parents=True, exist_ok=True)
          verifier_path.write_text(dedent(verifier).lstrip(), encoding="utf-8")
          verifier_path.chmod(0o755)

          vex_tests = r'''from __future__ import annotations

          import json
          import subprocess
          import sys
          import tempfile
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPT = ROOT / "scripts/verify_trivy_critical_vex.py"


          def report(cve: str = "CVE-2099-0001") -> dict:
              return {
                  "Results": [
                      {
                          "Vulnerabilities": [
                              {
                                  "VulnerabilityID": cve,
                                  "PkgName": "example-package",
                                  "InstalledVersion": "1.2.3",
                                  "Severity": "CRITICAL",
                              }
                          ]
                      }
                  ]
              }


          def vex(expires: str = "2026-08-31") -> dict:
              return {
                  "schema_version": 1,
                  "reviewed_at": "2026-08-01",
                  "expires_at": expires,
                  "tracking_issue": 7,
                  "entries": [
                      {
                          "id": "CVE-2099-0001",
                          "decision": "not_exploitable",
                          "installed_version": "1.2.3",
                          "packages": {"controller": ["example-package"]},
                          "rationale": "This deterministic fixture has no path from an external input to the synthetic vulnerable operation and exists only to verify exact matching.",
                          "source": "https://security-tracker.debian.org/tracker/CVE-2099-0001",
                      }
                  ],
              }


          class CriticalVexTests(unittest.TestCase):
              def run_verifier(self, report_payload: dict, vex_payload: dict) -> subprocess.CompletedProcess[str]:
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      report_path = root / "controller-vulnerabilities.json"
                      vex_path = root / "vex.json"
                      output_path = root / "result.json"
                      report_path.write_text(json.dumps(report_payload), encoding="utf-8")
                      vex_path.write_text(json.dumps(vex_payload), encoding="utf-8")
                      return subprocess.run(
                          [
                              sys.executable,
                              str(SCRIPT),
                              "--today",
                              "2026-08-05",
                              "--vex",
                              str(vex_path),
                              "--output",
                              str(output_path),
                              str(report_path),
                          ],
                          check=False,
                          capture_output=True,
                          text=True,
                      )

              def test_exact_current_determination_passes(self):
                  completed = self.run_verifier(report(), vex())
                  self.assertEqual(completed.returncode, 0, completed.stderr)

              def test_new_cve_fails_closed(self):
                  completed = self.run_verifier(report("CVE-2099-9999"), vex())
                  self.assertEqual(completed.returncode, 1)
                  self.assertIn("unreviewed CRITICAL findings", completed.stderr)

              def test_expired_determination_fails_closed(self):
                  completed = self.run_verifier(report(), vex("2026-08-04"))
                  self.assertEqual(completed.returncode, 2)
                  self.assertIn("VEX expired", completed.stderr)


          if __name__ == "__main__":
              unittest.main()
          '''
          Path("tests/test_trivy_critical_vex.py").write_text(
              dedent(vex_tests).lstrip(), encoding="utf-8"
          )

          contract = r'''from __future__ import annotations

          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          CI = ROOT / ".github/workflows/ci.yml"
          RELEASE = ROOT / ".github/workflows/release-gates.yml"
          POLICY = ROOT / "docs/VNC_REMOTE_CONTROL_SERVER_RELEASE_POLICY_2026-08-05.md"


          class ReleasePolicyContractTests(unittest.TestCase):
              def test_functional_ci_remains_authoritative(self):
                  text = CI.read_text(encoding="utf-8")
                  self.assertTrue(text.startswith("name: CI\n"))
                  self.assertIn("cargo fmt --all --check", text)
                  self.assertIn(
                      "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
                      text,
                  )
                  self.assertIn("cargo test --locked --workspace --all-features", text)
                  self.assertIn("Run R13 Compose integration and E2E validation", text)

              def test_release_workflow_contains_fail_closed_jobs(self):
                  text = RELEASE.read_text(encoding="utf-8")
                  required = (
                      "name: Release Gates",
                      "static_policy:",
                      "native_safety:",
                      "image_security:",
                      "cargo deny check",
                      "actionlint .github/workflows/*.yml",
                      "shellcheck --severity=warning",
                      "docker buildx build --check",
                      "docker compose -f deploy/compose.yaml config --quiet",
                      "gitleaks git . --redact --no-banner --exit-code 1",
                      "--format cyclonedx",
                      "-Zsanitizer=address",
                      "-Zsanitizer=thread",
                      "PROPTEST_DISABLE_FAILURE_PERSISTENCE: \"1\"",
                      "miri test",
                      "scripts/verify_trivy_critical_vex.py",
                  )
                  for value in required:
                      with self.subTest(value=value):
                          self.assertIn(value, text)
                  self.assertNotIn("continue-on-error: true", text)
                  self.assertNotIn("--ignore-unfixed", text)

              def test_cache_and_actions_are_immutably_pinned(self):
                  text = RELEASE.read_text(encoding="utf-8")
                  self.assertIn(
                      "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
                      text,
                  )
                  self.assertNotIn("actions/cache@v", text)
                  self.assertIn("fetch-depth: 0", text)

              def test_security_policy_forbids_silent_exceptions(self):
                  text = POLICY.read_text(encoding="utf-8")
                  self.assertIn("There are no implicit or silent exceptions", text)
                  self.assertIn("Any unmatched CRITICAL tuple is release-blocking", text)
                  self.assertIn("`--ignore-unfixed` is prohibited", text)
                  self.assertIn("may not be changed to `continue-on-error`", text)
                  self.assertIn("must not contain bearer tokens", text)
                  self.assertIn("Neither workflow substitutes for the other", text)


          if __name__ == "__main__":
              unittest.main()
          '''
          Path("tests/test_release_policy_contract.py").write_text(
              dedent(contract).lstrip(), encoding="utf-8"
          )

          policy = r'''# v0.1 Release Security and Native-Safety Policy

          Date: 2026-08-05
          Repository: `ekkus93/vnc-remote-control-server`
          Scope: the v0.1 release candidate and every later release unless superseded by a stricter policy.

          ## Fail-closed release gates

          Both the authoritative `CI` workflow and the `Release Gates` workflow must complete successfully on the exact release-candidate commit. `CI` proves functional and integration behavior; `Release Gates` proves static policy, native-safety, dependency, history, image-vulnerability, and SBOM requirements. Neither workflow substitutes for the other. A skipped, cancelled, neutral, timed-out, or failed required job is not acceptance evidence.

          The following findings block release:

          - any Rust advisory, prohibited license, wildcard dependency, or unapproved registry/source rejected by `cargo deny check`;
          - any secret finding from Gitleaks across the complete reachable Git history;
          - any CRITICAL image finding that is not matched by an exact, current reachability determination;
          - any ShellCheck warning/error, actionlint error, BuildKit Dockerfile check, or Compose validation failure;
          - any AddressSanitizer, ThreadSanitizer, or Miri failure;
          - any ordinary formatting, Clippy, unit, documentation, desktop, native-adapter, Compose, integration, API, or end-to-end failure.

          HIGH image vulnerabilities are retained in JSON evidence and must be reviewed. They are not automatic v0.1 blockers unless they are exploitable in the shipped configuration, affect a security boundary, or are escalated by the release reviewer.

          ## Exact CRITICAL VEX determinations

          There are no implicit or silent exceptions. `--ignore-unfixed` is prohibited, wildcard ignores are prohibited, and scanner exit codes may not be discarded. The release gate parses the raw Trivy JSON and matches every CRITICAL finding by exact image, CVE, binary package, and installed version. Any unmatched CRITICAL tuple is release-blocking. A changed package version is unmatched and therefore blocking.

          A permitted determination must be either `not_affected` or `not_exploitable`, include a substantive reachability rationale, cite the Debian Security Tracker, link a repository tracking issue, and expire no more than 30 days after review. Risk-acceptance entries are not permitted for v0.1. Stale determinations that no longer appear in the scan also fail the gate so they cannot accumulate silently.

          Current determinations are stored in `security/trivy-critical-vex.json` and tracked by issue #7. They expire on 2026-09-04. Expiry, a new finding, a package-version change, a new application input path, or a mismatch between the report and the VEX file blocks release.

          ## Native-safety coverage and limitations

          AddressSanitizer instruments the Rust LibVNCClient adapter and its boundary tests. ThreadSanitizer is limited to Rust-only shared-state tests because combining TSan with the distribution LibVNCClient shared library is not a reliable signal. Rust does not expose a general UBSan mode; Miri is the release gate for Rust undefined behavior and provenance checks. The Debian LibVNCClient shared library is not rebuilt with sanitizers, so upstream native-library defects remain outside this repository's instrumentation boundary.

          These limitations must remain visible in the release evidence. A sanitizer command may not be changed to `continue-on-error`, wrapped in an unconditional success fallback, or replaced by a compile-only check without an explicit policy update.

          Miri disables only Proptest's filesystem failure-persistence feature because Miri does not support that host filesystem attachment path. Test generation, shrinking, assertions, and the complete pure-Rust core test target remain enabled.

          ## Image and artifact evidence

          Release Gates builds the controller and desktop release images from the candidate commit, scans both images, and generates CycloneDX SBOMs. Static-policy, native-safety, raw vulnerability, exact VEX evaluation, and image-security artifacts are retained for 30 days. Failure artifacts must remain sanitized and must not contain bearer tokens, VNC passwords, typed text, clipboard payloads, or framebuffer screenshots.

          ## Tool pinning

          The release gate pins the Rust stable and nightly toolchains, cargo-deny, actionlint, Gitleaks, Trivy, and GitHub Actions by immutable version or commit. Downloaded release archives are checked against the publisher-provided checksum manifest before installation.
          '''
          Path("docs/VNC_REMOTE_CONTROL_SERVER_RELEASE_POLICY_2026-08-05.md").write_text(
              dedent(policy).lstrip(), encoding="utf-8"
          )
          PY

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          shellcheck --severity=warning \
            desktop/entrypoint.sh \
            desktop/healthcheck.sh \
            desktop/xstartup \
            tests/desktop/run.sh \
            tests/native/run.sh \
            tests/worker-e2e/run.sh \
            tests/worker-text-clipboard-e2e/run.sh \
            tests/http-e2e/run.sh \
            controller/healthcheck.sh \
            tests/compose/run.sh \
            tests/integration/run.sh
          python3 -m unittest discover -s tests -p 'test_trivy_critical_vex.py' -v
          git diff --check

      - name: Commit ordinary R16 fixes directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add \
            desktop/entrypoint.sh \
            tests/http-e2e/run.sh \
            tests/compose/run.sh \
            tests/integration/run.sh \
            security/trivy-critical-vex.json \
            scripts/verify_trivy_critical_vex.py \
            tests/test_trivy_critical_vex.py \
            tests/test_release_policy_contract.py \
            docs/VNC_REMOTE_CONTROL_SERVER_RELEASE_POLICY_2026-08-05.md
          git diff --cached --check
          git commit -m 'Fix R16 release gate blockers'
          git push origin HEAD:master
