name: Diagnose connected stall

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/diagnose-connected-stall.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvncserver-dev pkg-config
      - name: Add runner-only snapshot diagnostic
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/instrument.py
          python3 /tmp/instrument.py
          cargo fmt --all
      - name: Run exact failing test
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --locked --package controller-api --lib worker::tests::reconnect::confirmed_stall_invalidates_reconnects_and_advances_revision -- --exact --nocapture
