name: R10 Read-Only HTTP Tag Cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r10-http-readonly-tag-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete validated candidate tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tags=(
              'r10-http-readonly-30936100767'
              'r10-http-readonly-30936258782'
          )
          for tag in "${tags[@]}"; do
              if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
              fi
              if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
                  printf 'temporary candidate tag still exists: %s\n' "$tag" >&2
                  exit 1
              fi
          done
          gh issue comment 1 --body "<!-- r10-http-readonly-cleanup --> Temporary R10 read-only HTTP candidate tags were removed after replay commit 151053b0d6dccf6422b4cd27b321d0904e46122c reached master."
