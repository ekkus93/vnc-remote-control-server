name: R10 runtime evidence finalizer

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r10-finalize-docs.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: r10-runtime-evidence-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    name: Finalize R10 runtime evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/r10-runtime

      - name: Apply exact evidence update
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/finalize_r10_runtime_docs.py
          git diff --check
          grep -Fq 'CI run: 30945615936' docs/VNC_REMOTE_CONTROL_SERVER_REBASE_TODO_2026-08-03.md
          grep -Fq 'Desktop/native/E2E job: 92114729086' docs/VNC_REMOTE_CONTROL_SERVER_R10_MUTATING_HTTP_EVIDENCE_2026-08-04.md

      - name: Commit evidence successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --check
          git commit -m 'Finalize R10 runtime validation evidence'
          git push origin HEAD:codex/r10-runtime

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --method POST \
            -f body="<!-- r10-runtime-evidence --> R10 runtime evidence finalizer succeeded. SHA: ${sha}. Run: ${GITHUB_RUN_ID}."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --method POST \
            -f body="<!-- r10-runtime-evidence --> R10 runtime evidence finalizer failed. SHA: ${sha}. Run: ${GITHUB_RUN_ID}."
