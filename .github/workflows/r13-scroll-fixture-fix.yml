name: Repair R13 Scroll Test Fixtures

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r13-scroll-fixture-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Reject horizontal scrolling before queueing and repair fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/controller-api/src/api_contract.rs')
          text = path.read_text(encoding='utf-8')

          old_command = (
              '    pub fn into_command(self, display: DisplayInfo) -> Result<WorkerCommand, DesktopError> {\n'
              '        validate_scroll(self.delta_x, self.delta_y)?;\n'
              '        Ok(WorkerCommand::Scroll {\n'
          )
          new_command = (
              '    pub fn into_command(self, display: DisplayInfo) -> Result<WorkerCommand, DesktopError> {\n'
              '        if self.delta_x != 0 {\n'
              '            return Err(DesktopError::Configuration(\n'
              '                "horizontal scrolling is not supported by v0.1".to_owned(),\n'
              '            ));\n'
              '        }\n'
              '        validate_scroll(self.delta_x, self.delta_y)?;\n'
              '        Ok(WorkerCommand::Scroll {\n'
          )
          if text.count(old_command) != 1:
              raise SystemExit(f'expected one public scroll conversion block, found {text.count(old_command)}')
          text = text.replace(old_command, new_command)

          old_fixture = (
              '            PointerScrollRequest {\n'
              '                x: 0,\n'
              '                y: 0,\n'
              '                delta_y:'
          )
          new_fixture = (
              '            PointerScrollRequest {\n'
              '                x: 0,\n'
              '                y: 0,\n'
              '                delta_x: 0,\n'
              '                delta_y:'
          )
          if text.count(old_fixture) != 2:
              raise SystemExit(f'expected two vertical scroll fixtures, found {text.count(old_fixture)}')
          path.write_text(text.replace(old_fixture, new_fixture), encoding='utf-8')
          PY
          cargo fmt --all --check
          RUSTFLAGS=-Dwarnings cargo clippy --locked -p controller-api --all-targets --all-features -- -D warnings
          RUSTFLAGS=-Dwarnings cargo test --locked -p controller-api --all-features
          git diff --check

      - name: Commit validated preflight repair directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add crates/controller-api/src/api_contract.rs
          git commit -m 'fix: reject horizontal scroll before queueing'
          git push origin HEAD:master
