name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Check formatting
        id: rustfmt_check
        run: cargo fmt --all --check

      - name: Capture rustfmt failure diff
        if: ${{ failure() && steps.rustfmt_check.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cargo fmt --all
          git diff --binary -- . > artifacts/rustfmt.patch
          test -s artifacts/rustfmt.patch

      - name: Upload rustfmt failure diff
        if: ${{ failure() && steps.rustfmt_check.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustfmt-failure-${{ github.run_id }}
          path: artifacts/rustfmt.patch
          if-no-files-found: error
          retention-days: 7

      - name: Run Clippy with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Compile first-party Python
        run: python -m compileall -q tools/ci_status tests desktop/test-app

      - name: Install Python client package with exact MCP test extra
        run: pip install -e './python[mcp]'

      - name: Install Python lint tools
        run: pip install ruff==0.12.0 pylint==4.0.5 mypy==1.19.1

      - name: Lint first-party Python with ruff
        run: ruff check .

      - name: Lint first-party Python with pylint
        run: pylint --rcfile=.pylintrc python/src/vnc_remote_control tests scripts tools/ci_status desktop/test-app

      - name: Type-check first-party Python with mypy
        run: mypy --config-file mypy.ini python/src/vnc_remote_control tests scripts tools/ci_status desktop/test-app

      - name: Run Python and workflow contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check first-party shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            desktop/entrypoint.sh \
            desktop/healthcheck.sh \
            desktop/xstartup \
            tests/desktop/run.sh \
            tests/native/run.sh \
            tests/worker-e2e/run.sh \
            tests/worker-text-clipboard-e2e/run.sh \
            tests/http-e2e/run.sh \
            controller/healthcheck.sh \
            tests/compose/run.sh \
            tests/integration/run.sh

      - name: Build CI evidence
        env:
          EVIDENCE_PATH: artifacts/ci-evidence.json
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          native_version = subprocess.run(
              ["pkg-config", "--modversion", "libvncclient"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if not native_version:
              raise SystemExit("pkg-config returned an empty LibVNCClient version")

          evidence = {
              "schema_version": 1,
              "workflow": "CI",
              "head_sha": os.environ["HEAD_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "result": "quality-gates-passed",
              "libvncclient_version": native_version,
          }
          Path(os.environ["EVIDENCE_PATH"]).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-evidence-${{ github.run_id }}
          path: artifacts/ci-evidence.json
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Secured Debian desktop and native adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install desktop and native smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libvncserver-dev \
            pkg-config \
            tigervnc-tools \
            tigervnc-viewer \
            xvfb

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Run desktop image smoke test
        run: tests/desktop/run.sh

      - name: Run native adapter smoke test
        run: bash tests/native/run.sh

      - name: Run WorkerHandle TigerVNC input E2E test
        id: worker_e2e
        env:
          WORKER_E2E_FAILURE_ARTIFACT_DIR: artifacts/worker-e2e-failure
        run: bash tests/worker-e2e/run.sh

      - name: Upload WorkerHandle E2E failure artifacts
        if: ${{ failure() && steps.worker_e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-e2e-failure-${{ github.run_id }}
          path: artifacts/worker-e2e-failure
          if-no-files-found: error
          retention-days: 14

      - name: Verify WorkerHandle E2E failure diagnostics
        shell: bash
        env:
          WORKER_E2E_FAILURE_ARTIFACT_DIR: artifacts/worker-e2e-self-test
          WORKER_E2E_FORCE_FAILURE_AFTER_INPUT: "1"
          WORKER_E2E_REDACTION_SELF_TEST: "1"
        run: |
          set -euo pipefail
          rm -rf -- "$WORKER_E2E_FAILURE_ARTIFACT_DIR"

          set +e
          bash tests/worker-e2e/run.sh
          status=$?
          set -e

          [[ "$status" -ne 0 ]] || {
              printf 'forced WorkerHandle E2E failure unexpectedly succeeded\n' >&2
              exit 1
          }

          for path in \
              worker-input-e2e.log \
              desktop.log \
              desktop-state.json \
              container-state.json \
              failure-manifest.json \
              redaction-self-test.log; do
              [[ -s "$WORKER_E2E_FAILURE_ARTIFACT_DIR/$path" ]] || {
                printf 'missing WorkerHandle E2E diagnostic: %s\n' "$path" >&2
                exit 1
              }
          done

          grep -Fq '"exit_status": 1' \
              "$WORKER_E2E_FAILURE_ARTIFACT_DIR/failure-manifest.json"
          grep -Fxq '[REDACTED]' \
              "$WORKER_E2E_FAILURE_ARTIFACT_DIR/redaction-self-test.log"

          if grep -R -Fq 'worker-e2e-vnc-password' "$WORKER_E2E_FAILURE_ARTIFACT_DIR"; then
              printf 'WorkerHandle E2E diagnostics retained the VNC password\n' >&2
              exit 1
          fi

          python3 - "$WORKER_E2E_FAILURE_ARTIFACT_DIR/desktop-state.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          state = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if state.get("schema_version") != 1:
              raise SystemExit("captured desktop state has an unexpected schema")
          if not state.get("events"):
              raise SystemExit("captured desktop state contains no input events")
          PY

          rm -rf -- "$WORKER_E2E_FAILURE_ARTIFACT_DIR"

      - name: Run WorkerHandle TigerVNC text and clipboard E2E test
        run: bash tests/worker-text-clipboard-e2e/run.sh

      - name: Run authenticated HTTP TigerVNC E2E test
        run: bash tests/http-e2e/run.sh

      - name: Run controller image, Compose, and persistence smoke test
        run: bash tests/compose/run.sh

      - name: Run R13 Compose integration and E2E validation
        id: r13_integration
        env:
          R13_FAILURE_ARTIFACT_DIR: artifacts/r13-integration-failure
        run: bash tests/integration/run.sh

      - name: Upload R13 integration failure diagnostics
        if: ${{ failure() && steps.r13_integration.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r13-integration-failure-${{ github.run_id }}
          path: artifacts/r13-integration-failure
          if-no-files-found: error
          retention-days: 14
