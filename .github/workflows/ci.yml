name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Compile first-party Python
        run: python -m compileall -q tools/ci_status tests desktop/test-app

      - name: Run Python and workflow contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check first-party shell syntax
        shell: bash
        run: |
          set -euo pipefail
          test -x tests/native/run.sh
          bash -n \
            desktop/entrypoint.sh \
            desktop/healthcheck.sh \
            desktop/xstartup \
            tests/desktop/run.sh \
            tests/native/run.sh

      - name: Build CI evidence
        env:
          EVIDENCE_PATH: artifacts/ci-evidence.json
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          native_version = subprocess.run(
              ["pkg-config", "--modversion", "libvncclient"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if not native_version:
              raise SystemExit("pkg-config returned an empty LibVNCClient version")

          evidence = {
              "schema_version": 1,
              "workflow": "CI",
              "head_sha": os.environ["HEAD_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "result": "quality-gates-passed",
              "libvncclient_version": native_version,
          }
          Path(os.environ["EVIDENCE_PATH"]).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-evidence-${{ github.run_id }}
          path: artifacts/ci-evidence.json
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Secured Debian desktop and native adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install desktop and native smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libvncserver-dev \
            pkg-config \
            tigervnc-tools \
            tigervnc-viewer \
            xvfb

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Run desktop image smoke test
        run: tests/desktop/run.sh

      - name: Run native adapter smoke test
        run: tests/native/run.sh
