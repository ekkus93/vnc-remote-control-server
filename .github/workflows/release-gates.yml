name: Release Gates

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static_policy:
    name: Release static and supply-chain gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: static-policy-${{ runner.os }}-rust-1.97.1-cargo-deny-0.19.0-cargo-auditable-0.7.2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            static-policy-${{ runner.os }}-rust-1.97.1-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libvncserver-dev \
            pkg-config \
            shellcheck

      - name: Install pinned release tools
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import urllib.request

          downloads = {
              "actionlint.tar.gz": (
                  "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_x86_64.tar.gz",
                  "023070a287cd8cccd71515fed96fa46dc66ca4f3a84abd9bd6c7e1be0d070d23",
              ),
              "hadolint": (
                  "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64",
                  "56de6a113a10b1dcebbb847b20cbbfcf3d4bc8a98c3b27593df722e3d8d7a1e0",
              ),
              "gitleaks.tar.gz": (
                  "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz",
                  "1c62541c5461fdc8b437d41bb3c040cb77505d5638e633f3cd8f59d8f1b780f9",
              ),
          }
          for name, (url, expected) in downloads.items():
              path = Path("/tmp") / name
              with urllib.request.urlopen(url) as response:
                  path.write_bytes(response.read())
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"checksum mismatch for {name}: {actual}")
          PY
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          install -m 0755 /tmp/hadolint "$HOME/.local/bin/hadolint"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          cargo +1.97.1 install --locked --version 0.19.0 cargo-deny
          cargo +1.97.1 install --locked --version 0.7.2 cargo-auditable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify pinned release tool versions
        run: |
          set -euo pipefail
          actionlint -version | grep -F '1.7.7'
          hadolint --version | grep -F '2.12.0'
          gitleaks version | grep -F '8.24.2'
          cargo deny --version | grep -F '0.19.0'
          cargo auditable --version | grep -F '0.7.2'

      - name: Scan full history for secrets
        run: |
          set -euo pipefail
          mkdir -p artifacts/gitleaks
          gitleaks git \
            --log-opts="--all" \
            --redact \
            --report-format json \
            --report-path artifacts/gitleaks/gitleaks.json

      - name: Upload Gitleaks report
        if: ${{ always() }}
        uses: actions/upload-artifact@6027e3aa2c585d4d7462b457e1f20770d4a1b7dd
        with:
          name: gitleaks-report
          path: artifacts/gitleaks/gitleaks.json
          if-no-files-found: error

      - name: Lint workflows
        run: actionlint

      - name: Lint permanent shell sources
        run: |
          shellcheck \
            desktop/entrypoint.sh \
            desktop/healthcheck.sh \
            desktop/xstartup \
            tests/desktop/run.sh \
            tests/native/run.sh \
            tests/worker-e2e/run.sh \
            tests/worker-text-clipboard-e2e/run.sh \
            tests/http-e2e/run.sh \
            controller/healthcheck.sh \
            tests/compose/run.sh \
            tests/integration/run.sh

      - name: Validate Dockerfiles with BuildKit
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build --check -f desktop/Dockerfile .
          docker build --check -f controller/Dockerfile .

      - name: Validate Compose manifests
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose \
            -f deploy/compose.yaml \
            -f deploy/compose.persistence.yaml \
            config --quiet
          docker compose \
            -f deploy/compose.yaml \
            -f deploy/compose.debug-vnc.yaml \
            config --quiet

      - name: Verify release policy contract
        run: python -m unittest tests.test_release_policy_contract -v

      - name: Enforce dependency policy
        run: cargo deny check

      - name: Build auditable release binary
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo auditable build --locked --release --bin controller-api

      - name: Verify auditable binary metadata
        run: |
          mkdir -p artifacts/auditable
          python scripts/verify_auditable_binary.py \
            --binary target/release/controller-api \
            --metadata-out artifacts/auditable/controller-api-auditable.json

      - name: Upload auditable binary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@6027e3aa2c585d4d7462b457e1f20770d4a1b7dd
        with:
          name: auditable-binary-evidence
          path: artifacts/auditable/controller-api-auditable.json
          if-no-files-found: error

  address_sanitizer:
    name: Native adapter AddressSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libvncserver-dev \
            pkg-config

      - name: Run native AddressSanitizer smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
        run: tests/release/asan/run.sh

  controller_tsan:
    name: Controller API ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install pinned nightly toolchain
        run: |
          rustup toolchain install nightly-2026-07-15 --profile minimal --component rust-src

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libvncserver-dev \
            pkg-config

      - name: Run controller-api under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread -Ctarget-feature=-crt-static
          RUSTDOCFLAGS: -Zsanitizer=thread -Ctarget-feature=-crt-static
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          cargo +nightly-2026-07-15 test \
            -Zbuild-std \
            --locked \
            -p controller-api \
            --lib \
            --target x86_64-unknown-linux-gnu

  core_tsan:
    name: Remote desktop core ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install pinned nightly toolchain
        run: |
          rustup toolchain install nightly-2026-07-15 --profile minimal --component rust-src

      - name: Run remote-desktop-core under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread -Ctarget-feature=-crt-static
          RUSTDOCFLAGS: -Zsanitizer=thread -Ctarget-feature=-crt-static
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          cargo +nightly-2026-07-15 test \
            -Zbuild-std \
            --locked \
            -p remote-desktop-core \
            --lib \
            --target x86_64-unknown-linux-gnu

  miri:
    name: Core Miri boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install pinned nightly Miri
        run: |
          rustup toolchain install nightly-2026-07-15 --profile minimal --component miri
          cargo +nightly-2026-07-15 miri setup

      - name: Run pure core under Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +nightly-2026-07-15 miri test --locked -p remote-desktop-core --lib

  trivy_sbom_vex:
    name: Trivy, SBOM, and VEX evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install pinned Trivy
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import urllib.request

          url = "https://github.com/aquasecurity/trivy/releases/download/v0.58.2/trivy_0.58.2_Linux-64bit.tar.gz"
          expected = "3d2e8615be9803064fe7b9a5fb459bb0ba356f0470b27d5819d44fc1607c97bf"
          archive = Path("/tmp/trivy.tar.gz")
          with urllib.request.urlopen(url) as response:
              archive.write_bytes(response.read())
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Trivy checksum mismatch: {actual}")
          PY
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/trivy.tar.gz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Trivy version
        run: trivy --version | grep -F 'Version: 0.58.2'

      - name: Build controller and desktop images
        run: |
          docker build -t vrc-controller:${GITHUB_SHA} -f controller/Dockerfile .
          docker build -t vrc-desktop:${GITHUB_SHA} -f desktop/Dockerfile .

      - name: Scan repository and images
        run: |
          mkdir -p artifacts/trivy
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output artifacts/trivy/repository.json \
            .
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output artifacts/trivy/controller-image.json \
            vrc-controller:${GITHUB_SHA}
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output artifacts/trivy/desktop-image.json \
            vrc-desktop:${GITHUB_SHA}

      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p artifacts/sbom
          trivy image \
            --format cyclonedx \
            --output artifacts/sbom/controller.cdx.json \
            vrc-controller:${GITHUB_SHA}
          trivy image \
            --format cyclonedx \
            --output artifacts/sbom/desktop.cdx.json \
            vrc-desktop:${GITHUB_SHA}
          trivy fs \
            --format cyclonedx \
            --output artifacts/sbom/repository.cdx.json \
            .

      - name: Validate VEX documents and enforcement path
        run: |
          python scripts/validate_vex.py \
            --vex-dir security/vex \
            --report artifacts/trivy/repository.json \
            --report artifacts/trivy/controller-image.json \
            --report artifacts/trivy/desktop-image.json

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@6027e3aa2c585d4d7462b457e1f20770d4a1b7dd
        with:
          name: release-gates-evidence
          path: |
            artifacts/trivy
            artifacts/sbom
            security/vex
          if-no-files-found: error
