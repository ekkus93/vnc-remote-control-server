name: Release Gates

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_policy:
    name: Release static and supply-chain gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: static-policy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            static-policy-${{ runner.os }}-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libvncserver-dev \
            pkg-config \
            shellcheck

      - name: Install pinned release policy tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deny --version 0.19.0 --locked
          cargo install cargo-auditable --version 0.7.2 --locked
          tool_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tool_dir"' EXIT
          cd "$tool_dir"
          curl --fail --show-error --silent --location --remote-name \
            https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_x86_64.tar.gz
          curl --fail --show-error --silent --location --remote-name \
            https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_checksums.txt
          grep ' actionlint_1.7.10_linux_x86_64.tar.gz$' actionlint_1.7.10_checksums.txt \
            | sha256sum --check --strict
          tar -xzf actionlint_1.7.10_linux_x86_64.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          curl --fail --show-error --silent --location --remote-name \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          curl --fail --show-error --silent --location --remote-name \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_checksums.txt
          grep ' gitleaks_8.30.0_linux_x64.tar.gz$' gitleaks_8.30.0_checksums.txt \
            | sha256sum --check --strict
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Record static policy tool versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/static-policy
          {
            rustc --version --verbose
            cargo --version --verbose
            cargo deny --version
            cargo auditable --version
            actionlint --version
            gitleaks version
            shellcheck --version
            docker version --format 'Docker client {{.Client.Version}}; server {{.Server.Version}}'
            docker buildx version
            docker compose version
            pkg-config --modversion libvncclient
          } > artifacts/static-policy/tool-versions.txt

      - name: Run full-history secret scan
        run: >-
          gitleaks git
          --config .gitleaks.toml
          --redact
          --report-format json
          --report-path artifacts/static-policy/gitleaks.json
          --log-opts='--all'
          .

      - name: Lint shell scripts
        run: >-
          shellcheck
          desktop/entrypoint.sh
          desktop/healthcheck.sh
          desktop/xstartup
          tests/desktop/run.sh
          tests/native/run.sh
          tests/worker-e2e/run.sh
          tests/worker-text-clipboard-e2e/run.sh
          tests/http-e2e/run.sh
          controller/healthcheck.sh
          tests/compose/run.sh
          tests/integration/run.sh

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Validate Dockerfiles with BuildKit
        run: |
          docker build --check desktop
          docker build --check -f controller/Dockerfile .

      - name: Validate Compose configuration
        run: |
          mkdir -p deploy/secrets
          printf 'release-gate-api-token\n' > deploy/secrets/api_token.txt
          printf 'release-gate-vnc-password\n' > deploy/secrets/vnc_password.txt
          chmod 0600 deploy/secrets/api_token.txt deploy/secrets/vnc_password.txt
          docker compose -f deploy/docker-compose.yml config --quiet
          rm -rf deploy/secrets

      - name: Enforce advisory, license, source, and duplicate policy
        run: cargo deny check advisories bans licenses sources

      - name: Build auditable release binary and inspect metadata
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          cargo auditable build --locked --release -p controller-api
          python3 scripts/verify_auditable_binary.py \
            target/release/controller-api \
            --output artifacts/static-policy/auditable-binary.json

      - name: Upload static policy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-policy-${{ github.run_id }}
          path: artifacts/static-policy
          if-no-files-found: warn
          retention-days: 30

  native_safety:
    name: Release native sanitizer and Miri gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install native sanitizer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            libvncserver-dev \
            pkg-config

      - name: Install pinned nightly toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-01 \
            --profile minimal \
            --component rust-src,miri

      - name: Restore native-safety dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: native-safety-${{ runner.os }}-nightly-2026-08-01-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            native-safety-${{ runner.os }}-nightly-2026-08-01-

      - name: Record native-safety coverage and versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-safety
          {
            rustc +nightly-2026-08-01 --version --verbose
            printf '\nLibVNCClient: '
            pkg-config --modversion libvncclient
            printf '\nCoverage notes:\n'
            printf '%s\n' \
              '- AddressSanitizer instruments the Rust adapter and boundary tests.' \
              '- ThreadSanitizer instruments controller-api worker, shutdown, events, framebuffer, and HTTP library tests plus remote-desktop-core.' \
              '- Miri remains scoped to remote-desktop-core because controller-api depends on Tokio, OS threads, and native FFI.' \
              '- Rust does not expose a general UBSan mode; Miri is the pure-Rust undefined-behavior gate.' \
              '- Miri isolation is disabled only for Proptest working-directory access.' \
              '- The distribution LibVNCClient shared library is not rebuilt with sanitizers.'
          } > artifacts/native-safety/toolchain.txt

      - name: Run adapter tests under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          CARGO_TARGET_DIR: target/asan
          RUSTFLAGS: -Zsanitizer=address
        run: >-
          cargo +nightly-2026-08-01 -Zbuild-std test
          --target x86_64-unknown-linux-gnu
          --locked
          --package libvnc-adapter
          --lib

      - name: Run controller concurrency tests under ThreadSanitizer
        env:
          CARGO_TARGET_DIR: target/tsan-controller
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        run: >-
          cargo +nightly-2026-08-01 -Zbuild-std test
          --target x86_64-unknown-linux-gnu
          --locked
          --package controller-api
          --lib

      - name: Run core shared-state tests under ThreadSanitizer
        env:
          CARGO_TARGET_DIR: target/tsan-core
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        run: >-
          cargo +nightly-2026-08-01 -Zbuild-std test
          --target x86_64-unknown-linux-gnu
          --locked
          --package remote-desktop-core
          --lib

      - name: Run core tests under Miri
        env:
          PROPTEST_CASES: "16"
          MIRIFLAGS: -Zmiri-disable-isolation
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-01 miri setup
          cargo +nightly-2026-08-01 miri test \
            --locked \
            --package remote-desktop-core \
            --lib

      - name: Upload native-safety evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-safety-${{ github.run_id }}
          path: artifacts/native-safety
          if-no-files-found: warn
          retention-days: 30

  image_security:
    name: Release image vulnerability and SBOM gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Prepare image-security evidence directory
        run: mkdir -p artifacts/image-security

      - name: Install pinned Trivy release
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tool_dir"' EXIT
          cd "$tool_dir"
          curl --fail --show-error --silent --location --remote-name \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          curl --fail --show-error --silent --location --remote-name \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_checksums.txt
          grep ' trivy_0.70.0_Linux-64bit.tar.gz$' trivy_0.70.0_checksums.txt \
            | sha256sum --check --strict
          tar -xzf trivy_0.70.0_Linux-64bit.tar.gz
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Record image-security tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            trivy --version
            docker version --format 'Docker client {{.Client.Version}}; server {{.Server.Version}}'
            docker buildx version
          } > artifacts/image-security/tool-versions.txt

      - name: Build exact-candidate release images
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --tag "vnc-remote-control-desktop:${{ github.sha }}" \
            desktop
          docker build \
            --tag "vnc-remote-control-controller:${{ github.sha }}" \
            --file controller/Dockerfile \
            .
          docker image inspect \
            "vnc-remote-control-desktop:${{ github.sha }}" \
            "vnc-remote-control-controller:${{ github.sha }}" \
            > artifacts/image-security/image-inspect.json

      - name: Generate vulnerability inventories and CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          for image in desktop controller; do
            ref="vnc-remote-control-${image}:${{ github.sha }}"
            trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --format json \
              --output "artifacts/image-security/${image}-vulnerabilities.json" \
              "$ref"
            trivy image \
              --format cyclonedx \
              --output "artifacts/image-security/${image}-sbom.cdx.json" \
              "$ref"
          done
          cp security/trivy-critical-vex.json artifacts/image-security/trivy-critical-vex.json

      - name: Enforce exact CRITICAL VEX determinations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_trivy_critical_vex.py \
            --vex security/trivy-critical-vex.json \
            --output artifacts/image-security/critical-vex-evaluation.json \
            artifacts/image-security/controller-vulnerabilities.json \
            artifacts/image-security/desktop-vulnerabilities.json

      - name: Upload image vulnerability, VEX, and SBOM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-security-${{ github.run_id }}
          path: artifacts/image-security
          if-no-files-found: warn
          retention-days: 30
