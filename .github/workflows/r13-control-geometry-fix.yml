name: Apply Deterministic R13 Control Geometry

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r13-control-geometry-fix.yml

permissions:
  contents: write

concurrency:
  group: r13-control-geometry-fix-master
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Publish deterministic control centers and use them in R13
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('desktop/test-app/test_app.py')
          app = app_path.read_text(encoding='utf-8')
          old_controls = (
              '        tk.Button(controls, text="Increment", width=14, command=self._increment).grid(row=0, column=0, padx=6)\n'
              '        tk.Button(controls, text="Copy", width=14, command=self._copy).grid(row=0, column=1, padx=6)\n'
              '        tk.Button(controls, text="Paste", width=14, command=self._paste).grid(row=0, column=2, padx=6)\n'
              '        tk.Button(controls, text="Reset", width=14, command=self._reset).grid(row=0, column=3, padx=6)\n'
          )
          new_controls = (
              '        self.control_widgets: dict[str, tk.Button] = {}\n'
              '        for name, label, column, command in (\n'
              '            ("increment", "Increment", 0, self._increment),\n'
              '            ("copy", "Copy", 1, self._copy),\n'
              '            ("paste", "Paste", 2, self._paste),\n'
              '            ("reset", "Reset", 3, self._reset),\n'
              '        ):\n'
              '            button = tk.Button(controls, text=label, width=14, command=command)\n'
              '            button.grid(row=0, column=column, padx=6)\n'
              '            self.control_widgets[name] = button\n'
          )
          if app.count(old_controls) != 1:
              raise SystemExit(f'expected one control block, found {app.count(old_controls)}')
          app = app.replace(old_controls, new_controls)
          idle_marker = '        self.click_target.pack(pady=24)\n\n    def _bind_events(self) -> None:\n'
          idle_replacement = (
              '        self.click_target.pack(pady=24)\n'
              '        self.root.update_idletasks()\n\n'
              '    def _bind_events(self) -> None:\n'
          )
          if app.count(idle_marker) != 1:
              raise SystemExit('test-app idle marker was not unique')
          app = app.replace(idle_marker, idle_replacement)
          write_marker = '    def _write_state(self) -> None:\n'
          centers_method = (
              '    def _control_centers(self) -> dict[str, dict[str, int]]:\n'
              '        return {\n'
              '            name: {\n'
              '                "x": int(widget.winfo_rootx() + widget.winfo_width() // 2),\n'
              '                "y": int(widget.winfo_rooty() + widget.winfo_height() // 2),\n'
              '            }\n'
              '            for name, widget in self.control_widgets.items()\n'
              '        }\n\n'
          )
          if app.count(write_marker) != 1:
              raise SystemExit('test-app write-state marker was not unique')
          app = app.replace(write_marker, centers_method + write_marker)
          pointer_marker = '            "pointer": self.pointer,\n'
          if app.count(pointer_marker) != 1:
              raise SystemExit('test-app pointer payload marker was not unique')
          app = app.replace(pointer_marker, pointer_marker + '            "controls": self._control_centers(),\n')
          app_path.write_text(app, encoding='utf-8')

          driver_path = Path('tests/integration/r13_integration.py')
          driver = driver_path.read_text(encoding='utf-8')
          chord_marker = (
              '    response = post_json(harness, "/v1/keyboard/chord", {"keys": ["CTRL_LEFT", "SHIFT_LEFT", "F6"]})\n'
              '    require(response.status == 202, f"chord failed: {response.status}")\n\n'
          )
          chord_replacement = chord_marker + (
              '    expected_keys = [\n'
              '        ("key_down", "F5"),\n'
              '        ("key_up", "F5"),\n'
              '        ("key_down", "Control_L"),\n'
              '        ("key_down", "Shift_L"),\n'
              '        ("key_down", "F6"),\n'
              '        ("key_up", "F6"),\n'
              '        ("key_up", "Shift_L"),\n'
              '        ("key_up", "Control_L"),\n'
              '    ]\n'
              '    key_state = harness.wait_desktop_state(\n'
              '        lambda value: any(\n'
              '            event.get("type") == "key_up" and event.get("key") == "Control_L"\n'
              '            for event in value.get("events", [])\n'
              '        )\n'
              '    )\n'
              '    key_index = 0\n'
              '    for event in key_state["events"]:\n'
              '        if key_index < len(expected_keys) and (event.get("type"), event.get("key")) == expected_keys[key_index]:\n'
              '            key_index += 1\n'
              '    require(key_index == len(expected_keys), "key/chord event order was not observed")\n\n'
          )
          if driver.count(chord_marker) != 1:
              raise SystemExit('R13 chord marker was not unique')
          driver = driver.replace(chord_marker, chord_replacement)

          start_marker = '    def select_all_entry() -> None:\n'
          end_marker = '    inbound: dict[str, Any] | None = None\n'
          if driver.count(start_marker) != 1 or driver.count(end_marker) != 1:
              raise SystemExit('R13 clipboard replacement markers were not unique')
          start = driver.index(start_marker)
          end = driver.index(end_marker, start)
          control_flow = (
              '    controls = harness.desktop_state().get("controls", {})\n'
              '    require(set(controls) >= {"copy", "paste", "reset"}, f"missing deterministic controls: {controls!r}")\n'
              '\n'
              '    def click_control(name: str) -> None:\n'
              '        point = controls[name]\n'
              '        click = post_json(\n'
              '            harness,\n'
              '            "/v1/pointer/click",\n'
              '            {"x": int(point["x"]), "y": int(point["y"]), "button": "left"},\n'
              '        )\n'
              '        require(click.status == 202, f"{name} control click failed: {click.status}")\n'
              '\n'
              '    click_control("paste")\n'
              '    harness.wait_desktop_state(\n'
              '        lambda value: value.get("text") == OUTBOUND_CLIPBOARD\n'
              '        and any(event.get("type") == "paste" for event in value.get("events", []))\n'
              '    )\n'
              '\n'
              '    click_control("reset")\n'
              '    harness.wait_desktop_state(\n'
              '        lambda value: value.get("text") == ""\n'
              '        and value.get("events") == []\n'
              '        and value.get("clipboard_revision") == 0\n'
              '    )\n'
              '    response = post_json(harness, "/v1/keyboard/text", {"text": INBOUND_CLIPBOARD})\n'
              '    require(response.status == 202, "copy fixture typing failed")\n'
              '    harness.wait_desktop_state(lambda value: value.get("text") == INBOUND_CLIPBOARD)\n'
              '    click_control("copy")\n'
              '    harness.wait_desktop_state(\n'
              '        lambda value: any(event.get("type") == "copy" for event in value.get("events", []))\n'
              '    )\n'
              '\n'
          )
          driver = driver[:start] + control_flow + driver[end:]

          old_key_block_start = '    events = final_state["events"]\n    expected_keys = [\n'
          old_key_block_end = '    require(index == len(expected_keys), "key/chord event order was not observed")\n\n'
          if driver.count(old_key_block_start) != 1 or driver.count(old_key_block_end) != 1:
              raise SystemExit('R13 old key-order block markers were not unique')
          old_start = driver.index(old_key_block_start)
          old_end = driver.index(old_key_block_end, old_start) + len(old_key_block_end)
          driver = driver[:old_start] + driver[old_end:]
          driver_path.write_text(driver, encoding='utf-8')
          PY
          python3 -m compileall -q desktop/test-app tests/integration
          python3 -m unittest tests.test_integration_contract -v
          git diff --check

      - name: Commit repair directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add desktop/test-app/test_app.py tests/integration/r13_integration.py
          git commit -m 'test: drive deterministic clipboard controls in R13'
          git push origin HEAD:master
