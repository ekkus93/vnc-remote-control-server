name: R8 worker integration

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/r8-worker-integration.yml
      - tools/r8_integrate_worker.py

permissions:
  contents: write
  issues: write

concurrency:
  group: r8-worker-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master
          fetch-depth: 1

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Build and publish validated commit object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUSTFLAGS: -Dwarnings
          RUSTDOCFLAGS: -D warnings
        run: |
          set -uo pipefail
          rm -f docs/R8_WORKER_INTEGRATION_DIAGNOSTIC.md
          status=0
          {
            python3 tools/r8_integrate_worker.py
            cargo fmt --all
            cargo fmt --all --check
            cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            cargo test --locked --workspace --all-targets --all-features
            cargo doc --locked --workspace --all-features --no-deps
          } >r8-worker-integration.log 2>&1 || status=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r8-worker-integration.yml tools/r8_integrate_worker.py

          if [ "$status" -eq 0 ]; then
            git add crates/controller-api/src/worker.rs
            test "$(git diff --cached --name-only | sort)" = $'.github/workflows/r8-worker-integration.yml\ncrates/controller-api/src/worker.rs\ntools/r8_integrate_worker.py'
            git commit -m "Wire atomic input controller into worker"
            outcome=success
          else
            {
              echo '# R8 worker integration diagnostic'
              echo
              echo "Validation exit status: $status"
              echo
              echo '## Candidate diff'
              echo
              echo '```diff'
              git diff -- crates/controller-api/src/worker.rs
              echo '```'
              echo
              echo '## Validation log'
              echo
              echo '```text'
              tail -n 500 r8-worker-integration.log
              echo '```'
            } > docs/R8_WORKER_INTEGRATION_DIAGNOSTIC.md
            git restore crates/controller-api/src/worker.rs
            git add docs/R8_WORKER_INTEGRATION_DIAGNOSTIC.md
            git commit -m "Record R8 worker integration diagnostic"
            outcome=failure
          fi

          candidate_sha=$(git rev-parse HEAD)
          git tag --force r8-worker-candidate "$candidate_sha"
          git push --force origin refs/tags/r8-worker-candidate
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -f body="R8 worker integration candidate: \`${candidate_sha}\` (${outcome}). Temporary ref: \`r8-worker-candidate\`."

          for _ in $(seq 1 180); do
            master_sha=$(git ls-remote origin refs/heads/master | cut -f1)
            if [ "$master_sha" = "$candidate_sha" ]; then
              git push origin :refs/tags/r8-worker-candidate
              exit 0
            fi
            sleep 10
          done

          echo "master did not advance to candidate within cleanup window" >&2
          exit 1
