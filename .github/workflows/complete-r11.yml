name: Complete R11

on:
  push:
    branches:
      - master
    paths:
      - .github/r11_payload_*.b64
      - .github/workflows/complete-r11.yml

permissions:
  contents: write

jobs:
  complete-r11:
    name: Complete R11 on master
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Reconstruct and apply R11 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/r11_payload_*.b64 > /tmp/r11_apply.py.xz.b64
          echo 'c6341053eb8895d713b5241396f2c89f37bfbe620ac56e4b1b6c5fbab1fac66f  /tmp/r11_apply.py.xz.b64' | sha256sum --check --strict
          base64 --decode /tmp/r11_apply.py.xz.b64 | xz --decompress > /tmp/r11_apply.py
          echo 'bbefead62145bf2d8bbee8410ac8a446b3669372f1ff8c61676b23c0b6bf755d  /tmp/r11_apply.py' | sha256sum --check --strict
          python3 -m py_compile /tmp/r11_apply.py
          python3 /tmp/r11_apply.py
          sed -i '/use tracing_subscriber::util::SubscriberInitExt;/d' crates/controller-api/src/observability.rs
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('crates/controller-api/src/runtime.rs')
          runtime_text = runtime_path.read_text(encoding='utf-8')
          runtime_old = '    let connection = builder.serve_connection(io, service);\n'
          runtime_new = '    let connection = builder.serve_connection(io, service).with_upgrades();\n'
          runtime_count = runtime_text.count(runtime_old)
          if runtime_count != 1:
              raise SystemExit(
                  f'upgrade runtime patch expected one match, found {runtime_count}'
              )
          runtime_path.write_text(
              runtime_text.replace(runtime_old, runtime_new, 1),
              encoding='utf-8',
          )

          e2e_path = Path('tests/http-e2e/run.sh')
          e2e_text = e2e_path.read_text(encoding='utf-8')
          e2e_old = 'PY\n\nlog "sending authenticated input and payload-redaction probes"'
          e2e_new = (
              'PY\n\n'
              'log "waiting for controller readiness after reconnect"\n'
              'wait_for_controller\n\n'
              'log "sending authenticated input and payload-redaction probes"'
          )
          e2e_count = e2e_text.count(e2e_old)
          if e2e_count != 1:
              raise SystemExit(
                  f'reconnect readiness patch expected one match, found {e2e_count}'
              )
          e2e_path.write_text(
              e2e_text.replace(e2e_old, e2e_new, 1),
              encoding='utf-8',
          )
          PY

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Update lockfile and run workspace tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --workspace --all-features

      - name: Run Clippy with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run locked workspace tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Build rustdoc with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Run Python and workflow contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/ci_status tests desktop/test-app
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check first-party shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Run real R11 WebSocket observability and TigerVNC E2E
        run: bash tests/http-e2e/run.sh

      - name: Commit validated R11 directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/r11_payload_*.b64 .github/workflows/complete-r11.yml
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete R11 WebSocket observability and overload'
          git push origin HEAD:master
