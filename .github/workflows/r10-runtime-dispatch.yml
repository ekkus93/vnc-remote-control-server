name: R10 runtime branch dispatcher

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r10-runtime-dispatch.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: r10-runtime-dispatch
  cancel-in-progress: true

jobs:
  apply-and-validate:
    name: Apply and validate R10 runtime branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/r10-runtime

      - name: Detect pending bootstrap
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/r10_runtime_patch.py ]]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install native build dependencies
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Apply runtime patch and compile repair
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r10_runtime_patch.py
          python3 tools/r10_runtime_repair.py

      - name: Format generated Rust
        if: steps.pending.outputs.apply == 'true'
        run: cargo fmt --all

      - name: Refresh lockfile
        if: steps.pending.outputs.apply == 'true'
        run: cargo check --workspace --all-targets --all-features

      - name: Run warning-denied Clippy
        if: steps.pending.outputs.apply == 'true'
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        if: steps.pending.outputs.apply == 'true'
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Check generated shell syntax
        if: steps.pending.outputs.apply == 'true'
        run: bash -n tests/http-e2e/run.sh

      - name: Commit validated runtime slice without workflow mutations
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/r10-runtime-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --check
          git commit -m "Complete R10 HTTP runtime and TigerVNC E2E"
          git push origin HEAD:codex/r10-runtime

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --method POST \
            -f body="<!-- r10-runtime-dispatch --> R10 runtime branch validation succeeded. Run: ${GITHUB_RUN_ID}. SHA: ${candidate_sha}."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --method POST \
            -f body="<!-- r10-runtime-dispatch --> R10 runtime branch validation failed. Run: ${GITHUB_RUN_ID}. SHA: ${candidate_sha}."
