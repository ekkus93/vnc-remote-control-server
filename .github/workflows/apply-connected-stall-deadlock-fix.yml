name: Apply connected stall deadlock repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-connected-stall-deadlock-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvncserver-dev pkg-config
      - name: Drop snapshot guard before transition
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/apply.py
          python3 /tmp/apply.py
          cargo fmt --all
          git diff --check
      - name: Run exact regression
        run: cargo test --locked --package controller-api --lib worker::tests::reconnect::confirmed_stall_invalidates_reconnects_and_advances_revision -- --exact --nocapture
      - name: Commit source repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-connected-stall-deadlock-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/controller-api/src/worker/loop_state.rs \
            .github/workflows/apply-connected-stall-deadlock-fix.yml
          git commit -m "Drop snapshot lock before stall transition"
          git push origin HEAD:master
