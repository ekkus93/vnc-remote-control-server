name: Diagnose controller ThreadSanitizer

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/diagnose-controller-tsan.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang libvncserver-dev pkg-config
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-08-01 --profile minimal --component rust-src
      - name: Run identical controller TSan command and capture result
        id: tsan
        shell: bash
        run: |
          set +e
          CARGO_TARGET_DIR=target/tsan-controller \
          RUSTFLAGS=-Zsanitizer=thread \
          TSAN_OPTIONS=halt_on_error=1 \
          cargo +nightly-2026-08-01 -Zbuild-std test \
            --target x86_64-unknown-linux-gnu \
            --locked \
            --package controller-api \
            --lib \
            > /tmp/controller-tsan.log 2>&1
          status=$?
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          cat /tmp/controller-tsan.log
      - name: Record diagnostic and remove workflow
        shell: bash
        env:
          TSAN_STATUS: ${{ steps.tsan.outputs.status }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          log = Path('/tmp/controller-tsan.log').read_text(errors='replace')
          if len(log) > 50000:
              log = log[-50000:]
          status = os.environ['TSAN_STATUS']
          body = f'''# Controller ThreadSanitizer Diagnostic

Date: 2026-08-06

Source SHA: `{os.environ['GITHUB_SHA']}`

Workflow run: `{os.environ['GITHUB_RUN_ID']}`

Exit status: `{status}`

Command:

```text
RUSTFLAGS=-Zsanitizer=thread TSAN_OPTIONS=halt_on_error=1 \\
cargo +nightly-2026-08-01 -Zbuild-std test \\
  --target x86_64-unknown-linux-gnu --locked --package controller-api --lib
```

Output:

```text
{log}
```
'''
          Path('docs/VNC_REMOTE_CONTROL_SERVER_CONTROLLER_TSAN_DIAGNOSTIC_2026-08-06.md').write_text(body)
          PY
          rm .github/workflows/diagnose-controller-tsan.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/VNC_REMOTE_CONTROL_SERVER_CONTROLLER_TSAN_DIAGNOSTIC_2026-08-06.md .github/workflows/diagnose-controller-tsan.yml
          git commit -m "Record controller TSan diagnostic"
          git push origin HEAD:master
