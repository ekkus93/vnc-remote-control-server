name: Repair R13 Secret Fixture Replacement

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r13-harness-secret-fix.yml

permissions:
  contents: write

concurrency:
  group: r13-harness-secret-fix-master
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Repair read-only secret fixture lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/r13_integration.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '''    harness.vnc_secret.write_text(WRONG_VNC_PASSWORD, encoding="utf-8")
              os.chmod(harness.vnc_secret, 0o444)
          ''': '''    os.chmod(harness.vnc_secret, 0o600)
              harness.vnc_secret.write_text(WRONG_VNC_PASSWORD, encoding="utf-8")
              os.chmod(harness.vnc_secret, 0o444)
          ''',
              '''    harness.vnc_secret.write_text(VNC_PASSWORD, encoding="utf-8")
              os.chmod(harness.vnc_secret, 0o444)
          ''': '''    os.chmod(harness.vnc_secret, 0o600)
              harness.vnc_secret.write_text(VNC_PASSWORD, encoding="utf-8")
              os.chmod(harness.vnc_secret, 0o444)
          ''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one fixture block, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile tests/integration/r13_integration.py
          python3 -m unittest tests.test_integration_contract -v
          git diff --check

      - name: Commit repair directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add tests/integration/r13_integration.py
          git commit -m 'test: repair R13 secret fixture replacement'
          git push origin HEAD:master
