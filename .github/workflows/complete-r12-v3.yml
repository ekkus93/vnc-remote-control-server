name: Complete R12 Final Retry

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/complete-r12-v3.yml

permissions:
  contents: write

concurrency:
  group: complete-r12-v3-master
  cancel-in-progress: false

jobs:
  complete-r12:
    name: Complete R12 final retry on master
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Install native and integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 600 apt-get -o Acquire::Retries=3 update
          sudo timeout 600 apt-get \
            -o Acquire::Retries=3 \
            -o DPkg::Lock::Timeout=120 \
            install --yes --no-install-recommends \
              build-essential \
              libvncserver-dev \
              pkg-config \
              tigervnc-tools \
              tigervnc-viewer \
              xvfb

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Reconstruct and apply R12 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/r12_payload_*.b64 > /tmp/r12_apply.py.xz.b64
          echo 'f9e879b0566bb3827a58ea129d39ec5199ecc9d9b64934c9142065cc6e3cb733  /tmp/r12_apply.py.xz.b64' | sha256sum --check --strict
          base64 --decode /tmp/r12_apply.py.xz.b64 | xz --decompress > /tmp/r12_apply.py
          echo '536cb06f9cf3cda2a015beac239fd7805a46613aed6b67ab96911bbd2388906e  /tmp/r12_apply.py' | sha256sum --check --strict
          python3 -m py_compile /tmp/r12_apply.py
          python3 /tmp/r12_apply.py

          python3 - <<'PYEXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/complete-r12-v2.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PYFIX'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('          PYFIX\n', start)
          lines = workflow[start:end].splitlines()
          if not lines or any(not line.startswith('          ') for line in lines if line):
              raise SystemExit('could not extract the verified R12 correction block')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          Path('/tmp/r12_pyfix.py').write_text(script, encoding='utf-8')
          PYEXTRACT
          python3 -m py_compile /tmp/r12_pyfix.py
          python3 /tmp/r12_pyfix.py

          cat > deploy/compose.debug-vnc.yaml <<'COMPOSE'
          # DEVELOPMENT ONLY: exposes raw VNC on host loopback for bounded diagnostics.
          services:
            desktop:
              ports:
                - target: 5901
                  published: "${VRC_DEBUG_VNC_PORT:-5901}"
                  host_ip: "127.0.0.1"
                  protocol: tcp
          COMPOSE

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run workspace tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Run Clippy with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build rustdoc with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Run Python and workflow contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/ci_status tests desktop/test-app
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check first-party shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.sh' -o -name xstartup \) -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

      - name: Run desktop smoke
        run: bash tests/desktop/run.sh

      - name: Run native adapter smoke
        run: bash tests/native/run.sh

      - name: Run WorkerHandle input E2E
        run: bash tests/worker-e2e/run.sh

      - name: Run WorkerHandle text and clipboard E2E
        run: bash tests/worker-text-clipboard-e2e/run.sh

      - name: Run authenticated HTTP and WebSocket E2E
        run: bash tests/http-e2e/run.sh

      - name: Run controller image, Compose, and persistence smoke
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/r12-compose-diagnostics
          bash -x tests/compose/run.sh 2>&1 \
            | tee /tmp/r12-compose-diagnostics/compose-trace.log

      - name: Upload Compose failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r12-compose-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/r12-compose-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit validated R12 directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/r12_payload_*.b64 .github/workflows/complete-r12*.yml
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete R12 controller image Compose and persistence'
          git push origin HEAD:master
