name: Apply R13 Incremental Framebuffer Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r13-incremental-framebuffer-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Install native and smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libvncserver-dev \
            pkg-config \
            tigervnc-tools \
            tigervnc-viewer \
            xvfb

      - name: Request the next incremental framebuffer update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('crates/libvnc-adapter/native/vnc_shim.c')
          source = source_path.read_text(encoding='utf-8')
          old = (
              '    client->revision += 1U;\n'
              '    client->complete = 1;\n'
              '}\n\n'
              'static void vrc_store_clipboard'
          )
          new = (
              '    client->revision += 1U;\n'
              '    client->complete = 1;\n'
              '    if (!SendFramebufferUpdateRequest(\n'
              '            native,\n'
              '            0,\n'
              '            0,\n'
              '            native->width,\n'
              '            native->height,\n'
              '            TRUE)) {\n'
              '        vrc_set_error(client, "incremental framebuffer request failed");\n'
              '        client->complete = 0;\n'
              '        client->connected = 0;\n'
              '    }\n'
              '}\n\n'
              'static void vrc_store_clipboard'
          )
          if source.count(old) != 1:
              raise SystemExit(f'expected one framebuffer completion block, found {source.count(old)}')
          source_path.write_text(source.replace(old, new), encoding='utf-8')

          test_path = Path('tests/test_native_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    def test_native_initialization_keeps_one_cleanup_owner(self):\n'
          addition = (
              '    def test_native_framebuffer_updates_rearm_incremental_delivery(self):\n'
              '        source = SHIM_SOURCE.read_text(encoding="utf-8")\n'
              '        callback_start = source.index("static void vrc_finished_framebuffer_update")\n'
              '        callback_end = source.index("static void vrc_store_clipboard", callback_start)\n'
              '        callback = source[callback_start:callback_end]\n'
              '        self.assertIn("SendFramebufferUpdateRequest(", callback)\n'
              '        self.assertIn("native->width", callback)\n'
              '        self.assertIn("native->height", callback)\n'
              '        self.assertIn("TRUE", callback)\n'
              '        self.assertIn("incremental framebuffer request failed", callback)\n'
              '        self.assertIn("client->complete = 0;", callback)\n'
              '        self.assertIn("client->connected = 0;", callback)\n'
              '\n'
          )
          if tests.count(marker) != 1:
              raise SystemExit('native contract insertion marker was not unique')
          test_path.write_text(tests.replace(marker, addition + marker), encoding='utf-8')
          PY
          python3 -m unittest tests.test_native_contract -v
          RUSTFLAGS=-Dwarnings cargo test --locked -p libvnc-adapter
          bash tests/native/run.sh
          git diff --check

      - name: Commit repair directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add crates/libvnc-adapter/native/vnc_shim.c tests/test_native_contract.py
          git commit -m 'fix: continue incremental framebuffer updates'
          git push origin HEAD:master
