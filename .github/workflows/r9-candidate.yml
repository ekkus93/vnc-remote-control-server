name: R9 Worker Candidate

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r9-candidate.yml
      - tools/r9_worker_patch.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  candidate:
    name: Generate and validate R9 worker candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Generate R9 candidate files
        run: python tools/r9_worker_patch.py

      - name: Format candidate
        run: cargo fmt --all

      - name: Reject whitespace errors
        run: git diff --check

      - name: Run Clippy with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Run Python contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Stage validated candidate files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            candidate/crates/controller-api/src \
            candidate/crates/remote-desktop-core/src
          cp crates/controller-api/src/input.rs candidate/crates/controller-api/src/input.rs
          cp crates/controller-api/src/worker.rs candidate/crates/controller-api/src/worker.rs
          cp crates/remote-desktop-core/src/lib.rs candidate/crates/remote-desktop-core/src/lib.rs

      - name: Upload validated R9 candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r9-worker-candidate-${{ github.run_id }}
          path: candidate
          if-no-files-found: error
          retention-days: 7

      - name: Publish successful candidate locator
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1 --body "<!-- r9-worker-candidate --> R9 worker candidate succeeded. Run: ${{ github.run_id }}. SHA: ${{ github.sha }}. Artifact: r9-worker-candidate-${{ github.run_id }}."

      - name: Publish failed candidate locator
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1 --body "<!-- r9-worker-candidate --> R9 worker candidate failed. Run: ${{ github.run_id }}. SHA: ${{ github.sha }}."
