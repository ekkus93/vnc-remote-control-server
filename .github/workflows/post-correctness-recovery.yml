name: Post-correctness recovery

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/post-correctness-recovery.yml

permissions:
  contents: write

concurrency:
  group: post-correctness-recovery-master-final
  cancel-in-progress: true

jobs:
  recover:
    name: Apply and validate recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out exact master tip
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Apply fail-closed recovery patches
        shell: bash
        run: |
          set -euo pipefail
          python .github/post-correctness-recovery.py
          python .github/post-correctness-recovery-boundary-fix.py
          python .github/post-correctness-recovery-api-fix.py
          test ! -e .github/post-correctness-recovery.py
          test ! -e .github/post-correctness-recovery-boundary-fix.py
          test ! -e .github/post-correctness-recovery-api-fix.py
          test ! -e .github/workflows/post-correctness-recovery.yml
          git diff --check

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Run Clippy with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --workspace --all-features

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Run Python and documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/ci_status tests desktop/test-app
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check permanent shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            desktop/entrypoint.sh \
            desktop/healthcheck.sh \
            desktop/xstartup \
            tests/desktop/run.sh \
            tests/native/run.sh \
            tests/worker-e2e/run.sh \
            tests/worker-text-clipboard-e2e/run.sh \
            tests/http-e2e/run.sh \
            controller/healthcheck.sh \
            tests/compose/run.sh \
            tests/integration/run.sh

      - name: Commit validated recovery
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --short)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Complete post-correctness hardening recovery"
          git push origin HEAD:master
