name: Post-correctness recovery

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/post-correctness-recovery.yml

permissions:
  contents: read

concurrency:
  group: post-correctness-recovery-master
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ false }}
    runs-on: ubuntu-slim
    steps:
      - run: true
