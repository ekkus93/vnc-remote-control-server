name: Post-correctness recovery executor

on:
  push:
    branches:
      - post-correctness-recovery-executor
    paths:
      - .github/workflows/post-correctness-recovery.yml

permissions:
  contents: write

concurrency:
  group: post-correctness-recovery-executor-macos
  cancel-in-progress: true

jobs:
  recover:
    name: Apply exact-anchor recovery patch
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out exact executor tip
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply fail-closed recovery patches
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/post-correctness-recovery.py
          python3 .github/post-correctness-recovery-boundary-fix.py
          python3 .github/post-correctness-recovery-api-fix.py
          test ! -e .github/post-correctness-recovery.py
          test ! -e .github/post-correctness-recovery-boundary-fix.py
          test ! -e .github/post-correctness-recovery-api-fix.py
          test ! -e .github/workflows/post-correctness-recovery.yml
          cargo fmt --all
          git diff --check

      - name: Run recovery source and documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_native_contract \
            tests.test_documentation_contract \
            -v

      - name: Commit exact-anchor recovery patch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply post-correctness hardening recovery"
          git push origin HEAD:post-correctness-recovery-executor
