name: PFH Implementation Apply

on:
  push:
    branches:
      - ralph/post-fcr-hardening-implementation-20260914

permissions:
  contents: write

jobs:
  apply-post-fcr-hardening:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply prepared patch and remove temporary files
        run: |
          set -euo pipefail
          if git log -1 --format=%s | grep -Fxq 'fix: implement post-FCR fail-closed hardening'; then
            echo 'implementation commit already present'
            exit 0
          fi
          cat .github/pfh-implementation-patch/part*.patch > "${RUNNER_TEMP}/pfh.patch"
          git apply --check "${RUNNER_TEMP}/pfh.patch"
          git apply "${RUNNER_TEMP}/pfh.patch"
          rm -rf .github/pfh-implementation-patch
          rm -f .github/workflows/pfh-implementation-apply.yml
          git add             crates/controller-api/src/config.rs             crates/controller-api/src/duration_policy.rs             python/src/vnc_remote_control/client.py             python/src/vnc_remote_control/mcp_outcomes.py             tests/test_post_fcr_hardening.py             docs/VNC_REMOTE_CONTROL_SERVER_POST_FCR_HARDENING_TODO_2026-09-14.md             .github/workflows/pfh-implementation-apply.yml             .github/pfh-implementation-patch
          git diff --cached --check
          git config user.name 'chatgpt-ralph-bridge[bot]'
          git config user.email '326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com'
          git commit -m 'fix: implement post-FCR fail-closed hardening'
          git push origin HEAD:ralph/post-fcr-hardening-implementation-20260914
