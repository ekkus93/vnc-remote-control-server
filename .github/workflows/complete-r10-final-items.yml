name: Complete remaining R10 items

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/complete-r10-final-items.yml

permissions:
  contents: write

jobs:
  complete-r10:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master
          fetch-depth: 0

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Correct patch target indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FIX_R10'
          from pathlib import Path

          path = Path('.github/complete_r10.py')
          text = path.read_text(encoding='utf-8')
          old = '''    dedent(
                  """\\
                          .layer(DefaultBodyLimit::max(state.maximum_json_bytes))
                          .layer(middleware::from_fn_with_state(
                  """
              ),
              dedent(
                  """\\
                          .layer(DefaultBodyLimit::max(state.maximum_json_bytes))
                          .layer(middleware::from_fn(access_log))
                          .layer(middleware::from_fn_with_state(
                  """
              ),'''
          new = '''    "        .layer(DefaultBodyLimit::max(state.maximum_json_bytes))\\n"
              "        .layer(middleware::from_fn_with_state(\\n",
              "        .layer(DefaultBodyLimit::max(state.maximum_json_bytes))\\n"
              "        .layer(middleware::from_fn(access_log))\\n"
              "        .layer(middleware::from_fn_with_state(\\n",'''
          if text.count(old) != 1:
              raise SystemExit(f'indentation target: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY_FIX_R10

      - name: Apply remaining R10 implementation
        run: python3 .github/complete_r10.py

      - name: Format and validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --workspace --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          RUSTDOCFLAGS=-Dwarnings cargo doc --locked --workspace --all-features --no-deps
          bash -n tests/http-e2e/run.sh

      - name: Run real authenticated HTTP and WebSocket E2E
        shell: bash
        run: |
          set -euo pipefail
          bash tests/http-e2e/run.sh

      - name: Commit directly to master and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/complete-r10-final-items.yml .github/complete_r10.py
          git config user.name "ekkus93"
          git config user.email "1386709+ekkus93@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete R10 WebSocket authentication and log redaction"
          git push origin HEAD:master
