name: Complete remaining R10 items

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/complete-r10-final-items.yml
      - .github/complete_r10.py

permissions:
  contents: write

jobs:
  complete-r10:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master
          fetch-depth: 0

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Apply R10 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/complete_r10.py

      - name: Format Rust sources
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all

      - name: Run workspace tests before lock enforcement
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features

      - name: Run Clippy with warnings denied
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run locked workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --all-features

      - name: Build rustdoc with warnings denied
        shell: bash
        run: |
          set -euo pipefail
          RUSTDOCFLAGS=-Dwarnings cargo doc --locked --workspace --all-features --no-deps

      - name: Check HTTP E2E shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/http-e2e/run.sh

      - name: Run real authenticated HTTP and WebSocket TigerVNC E2E
        shell: bash
        run: |
          set -euo pipefail
          bash tests/http-e2e/run.sh

      - name: Commit validated R10 completion directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/R10_EXECUTOR_FAILURE.txt
          rm -f .github/workflows/complete-r10-final-items.yml .github/complete_r10.py
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo "R10 executor produced no changes" >&2
            exit 1
          }
          git config user.name "ekkus93"
          git config user.email "1386709+ekkus93@users.noreply.github.com"
          git commit -m "Complete R10 WebSocket authentication and log redaction"
          git push origin HEAD:master
