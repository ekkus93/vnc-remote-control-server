name: Apply controller TSan evidence wiring

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-controller-tsan-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve controller TSan output in permanent evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release-gates.yml')
          text = path.read_text()
          start_marker = '      - name: Run controller concurrency tests under ThreadSanitizer\n'
          end_marker = '      - name: Run core shared-state tests under ThreadSanitizer\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''      - name: Run controller concurrency tests under ThreadSanitizer
        env:
          CARGO_TARGET_DIR: target/tsan-controller
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-01 -Zbuild-std test \
            --target x86_64-unknown-linux-gnu \
            --locked \
            --package controller-api \
            --lib \
            2>&1 | tee artifacts/native-safety/controller-tsan.log

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          grep -q 'controller-tsan.log' .github/workflows/release-gates.yml
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-controller-tsan-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-gates.yml .github/workflows/apply-controller-tsan-evidence.yml
          git commit -m "Preserve controller TSan failure output"
          git push origin HEAD:master
