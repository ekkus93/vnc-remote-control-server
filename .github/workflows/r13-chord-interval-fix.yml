name: Apply Deterministic R13 Chord Interval

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r13-chord-interval-fix.yml

permissions:
  contents: write

concurrency:
  group: r13-chord-interval-fix-master
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libvncserver-dev \
            pkg-config

      - name: Increase bounded chord transition interval
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/controller-api/src/input.rs')
          text = path.read_text(encoding='utf-8')
          old = 'const CHORD_EVENT_SETTLE_INTERVAL: Duration = Duration::from_millis(5);'
          new = 'const CHORD_EVENT_SETTLE_INTERVAL: Duration = Duration::from_millis(20);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one 5ms chord interval, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all --check
          RUSTFLAGS=-Dwarnings cargo test --locked --workspace --all-features input::tests
          git diff --check

      - name: Commit repair directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add crates/controller-api/src/input.rs
          git commit -m 'fix: make real VNC chord ordering deterministic'
          git push origin HEAD:master
