name: Post-correctness duplicate H1 cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/post-correctness-fixup.yml

permissions:
  contents: write

concurrency:
  group: post-correctness-duplicate-h1-cleanup
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact master tip
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply exact duplicate cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/post-correctness-duplicate-h1-fix.py
          test ! -e .github/post-correctness-duplicate-h1-fix.py
          test ! -e .github/workflows/post-correctness-fixup.yml
          cargo fmt --all
          git diff --check

      - name: Compile and run CR12 positive control
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p controller-api --lib matching_native_frame_positive_control_reaches_connected -- --exact --nocapture

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Remove duplicate CR12 positive control"
          git push origin HEAD:master
