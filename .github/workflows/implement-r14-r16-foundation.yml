name: Implement R14 and R16 Foundation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/implement-r14-r16-foundation.yml

permissions:
  contents: write

concurrency:
  group: implement-r14-r16-foundation-master
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Add permanent release gates and policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path('.')
          ci_path = root / '.github/workflows/ci.yml'
          ci = ci_path.read_text(encoding='utf-8')

          cache_marker = '''      - name: Fetch locked Rust dependencies
                run: cargo fetch --locked
          '''
          cache_marker = dedent(cache_marker).lstrip('\n')
          cache_block = '''      - name: Restore Cargo dependency cache
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
                with:
                  path: |
                    ~/.cargo/registry/index
                    ~/.cargo/registry/cache
                    ~/.cargo/git/db
                  key: cargo-__EXPR_OPEN__ runner.os }}-rust-1.97.1-__EXPR_OPEN__ hashFiles('Cargo.lock') }}
                  restore-keys: |
                    cargo-__EXPR_OPEN__ runner.os }}-rust-1.97.1-

              - name: Fetch locked Rust dependencies
                run: cargo fetch --locked
          '''
          cache_block = dedent(cache_block).lstrip('\n').replace('__EXPR_OPEN__', '${{')
          if 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' not in ci:
              if cache_marker not in ci:
                  raise SystemExit('could not locate cargo fetch marker in CI workflow')
              ci = ci.replace(cache_marker, cache_block, 1)

          jobs = r'''
            native_safety:
              name: Native sanitizer and Miri gates
              runs-on: ubuntu-24.04
              timeout-minutes: 45

              steps:
                - name: Check out repository
                  uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

                - name: Install native sanitizer dependencies
                  shell: bash
                  run: |
                    set -euo pipefail
                    sudo apt-get update
                    sudo apt-get install --yes --no-install-recommends \
                      build-essential \
                      clang \
                      libvncserver-dev \
                      pkg-config

                - name: Install pinned nightly toolchain
                  shell: bash
                  run: |
                    set -euo pipefail
                    rustup toolchain install nightly-2026-08-01 \
                      --profile minimal \
                      --component rust-src,miri

                - name: Restore native safety cache
                  uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
                  with:
                    path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                    key: native-safety-__EXPR_OPEN__ runner.os }}-nightly-2026-08-01-__EXPR_OPEN__ hashFiles('Cargo.lock') }}
                    restore-keys: |
                      native-safety-__EXPR_OPEN__ runner.os }}-nightly-2026-08-01-

                - name: Run adapter tests under AddressSanitizer
                  env:
                    ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
                    RUSTFLAGS: -Zsanitizer=address
                  run: >-
                    cargo +nightly-2026-08-01 test
                    -Zbuild-std
                    --target x86_64-unknown-linux-gnu
                    --locked
                    --package libvnc-adapter
                    --lib

                - name: Run Rust-only shared-state tests under ThreadSanitizer
                  env:
                    RUSTFLAGS: -Zsanitizer=thread
                    TSAN_OPTIONS: halt_on_error=1
                  run: >-
                    cargo +nightly-2026-08-01 test
                    -Zbuild-std
                    --target x86_64-unknown-linux-gnu
                    --locked
                    --package remote-desktop-core
                    --lib

                - name: Run core tests under Miri
                  shell: bash
                  run: |
                    set -euo pipefail
                    cargo +nightly-2026-08-01 miri setup
                    cargo +nightly-2026-08-01 miri test \
                      --locked \
                      --package remote-desktop-core \
                      --lib

                - name: Record native safety toolchain
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p artifacts/native-safety
                    {
                      rustc +nightly-2026-08-01 --version --verbose
                      printf '\nLibVNCClient: '
                      pkg-config --modversion libvncclient
                      printf '\nCoverage notes:\n'
                      printf '%s\n' \
                        '- AddressSanitizer instruments the Rust adapter and boundary tests.' \
                        '- ThreadSanitizer is limited to Rust-only core shared-state tests.' \
                        '- Rust does not expose a general UBSan mode; Miri is the undefined-behavior gate.' \
                        '- The distribution LibVNCClient shared library is not rebuilt with sanitizers.'
                    } > artifacts/native-safety/toolchain.txt

                - name: Upload native safety evidence
                  if: __EXPR_OPEN__ always() }}
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                  with:
                    name: native-safety-__EXPR_OPEN__ github.run_id }}
                    path: artifacts/native-safety
                    if-no-files-found: warn
                    retention-days: 30

            security:
              name: Supply-chain and container security
              runs-on: ubuntu-24.04
              timeout-minutes: 60

              steps:
                - name: Check out complete repository history
                  uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
                  with:
                    fetch-depth: 0

                - name: Install pinned Rust toolchain
                  shell: bash
                  run: |
                    set -euo pipefail
                    rustup toolchain install 1.97.1 --profile minimal
                    rustup default 1.97.1

                - name: Restore security tool cache
                  uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
                  with:
                    path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                    key: security-tools-__EXPR_OPEN__ runner.os }}-cargo-deny-0.19.7-__EXPR_OPEN__ hashFiles('Cargo.lock') }}
                    restore-keys: |
                      security-tools-__EXPR_OPEN__ runner.os }}-cargo-deny-0.19.7-

                - name: Install pinned release tools
                  shell: bash
                  run: |
                    set -euo pipefail
                    sudo apt-get update
                    sudo apt-get install --yes --no-install-recommends \
                      ca-certificates \
                      curl \
                      shellcheck
                    cargo install cargo-deny --locked --version 0.19.7

                    tool_dir="$(mktemp -d)"
                    trap 'rm -rf -- "$tool_dir"' EXIT
                    cd "$tool_dir"

                    curl --fail --show-error --silent --location --remote-name \
                      https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
                    curl --fail --show-error --silent --location --remote-name \
                      https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
                    grep ' actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt \
                      | sha256sum --check --strict
                    tar -xzf actionlint_1.7.12_linux_amd64.tar.gz
                    sudo install -m 0755 actionlint /usr/local/bin/actionlint

                    curl --fail --show-error --silent --location --remote-name \
                      https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                    curl --fail --show-error --silent --location --remote-name \
                      https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
                    grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt \
                      | sha256sum --check --strict
                    tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
                    sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

                    curl --fail --show-error --silent --location --remote-name \
                      https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
                    curl --fail --show-error --silent --location --remote-name \
                      https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_checksums.txt
                    grep ' trivy_0.70.0_Linux-64bit.tar.gz$' trivy_0.70.0_checksums.txt \
                      | sha256sum --check --strict
                    tar -xzf trivy_0.70.0_Linux-64bit.tar.gz
                    sudo install -m 0755 trivy /usr/local/bin/trivy

                - name: Run ShellCheck
                  shell: bash
                  run: |
                    set -euo pipefail
                    shellcheck \
                      desktop/entrypoint.sh \
                      desktop/healthcheck.sh \
                      desktop/xstartup \
                      tests/desktop/run.sh \
                      tests/native/run.sh \
                      tests/worker-e2e/run.sh \
                      tests/worker-text-clipboard-e2e/run.sh \
                      tests/http-e2e/run.sh \
                      controller/healthcheck.sh \
                      tests/compose/run.sh \
                      tests/integration/run.sh

                - name: Run actionlint
                  run: actionlint .github/workflows/*.yml

                - name: Check Dockerfiles with BuildKit
                  shell: bash
                  run: |
                    set -euo pipefail
                    docker buildx build --check --file desktop/Dockerfile desktop
                    docker buildx build --check --file controller/Dockerfile .

                - name: Validate all Compose configurations
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p deploy/secrets
                    printf 'validation-only\n' > deploy/secrets/api_token.txt
                    printf 'validation-only\n' > deploy/secrets/vnc_password.txt
                    docker compose -f deploy/compose.yaml config --quiet
                    docker compose \
                      -f deploy/compose.yaml \
                      -f deploy/compose.debug-vnc.yaml \
                      config --quiet
                    docker compose \
                      -f deploy/compose.yaml \
                      -f deploy/compose.persistence.yaml \
                      config --quiet
                    rm -rf -- deploy/secrets

                - name: Enforce Rust advisory, license, and source policy
                  run: cargo deny check

                - name: Scan complete Git history for secrets
                  run: gitleaks git --redact --no-banner --exit-code 1 .

                - name: Build release images
                  shell: bash
                  run: |
                    set -euo pipefail
                    docker build \
                      --tag "vnc-remote-control-desktop:__EXPR_OPEN__ github.sha }}" \
                      desktop
                    docker build \
                      --tag "vnc-remote-control-controller:__EXPR_OPEN__ github.sha }}" \
                      --file controller/Dockerfile \
                      .

                - name: Scan release images and generate SBOMs
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p artifacts/security
                    for image in desktop controller; do
                      ref="vnc-remote-control-${image}:__EXPR_OPEN__ github.sha }}"
                      trivy image \
                        --scanners vuln \
                        --severity HIGH,CRITICAL \
                        --format json \
                        --output "artifacts/security/${image}-vulnerabilities.json" \
                        "$ref"
                      trivy image \
                        --scanners vuln \
                        --severity CRITICAL \
                        --exit-code 1 \
                        "$ref"
                      trivy image \
                        --format cyclonedx \
                        --output "artifacts/security/${image}-sbom.cdx.json" \
                        "$ref"
                    done

                - name: Record security tool versions and policy result
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p artifacts/security
                    {
                      cargo deny --version
                      actionlint -version
                      shellcheck --version
                      gitleaks version
                      trivy --version
                      docker version --format 'Docker client {{.Client.Version}}; server {{.Server.Version}}'
                      docker compose version
                      pkg-config --modversion libvncclient 2>/dev/null || true
                      printf '%s\n' 'Release policy result: all configured blocking gates passed.'
                    } > artifacts/security/tool-versions.txt

                - name: Upload security reports and SBOMs
                  if: __EXPR_OPEN__ always() }}
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                  with:
                    name: security-evidence-__EXPR_OPEN__ github.run_id }}
                    path: artifacts/security
                    if-no-files-found: warn
                    retention-days: 30
          '''
          jobs = dedent(jobs).lstrip('\n').replace('__EXPR_OPEN__', '${{')
          if '\n  native_safety:\n' not in ci:
              ci = ci.rstrip() + '\n\n' + jobs.rstrip() + '\n'
          ci_path.write_text(ci, encoding='utf-8')

          policy = r'''# v0.1 Release Security and Native-Safety Policy

Date: 2026-08-05
Repository: `ekkus93/vnc-remote-control-server`
Scope: the v0.1 release candidate and every later release unless superseded by a stricter policy.

## Fail-closed release gates

The authoritative `CI` workflow must complete successfully on the exact release-candidate commit. A skipped, cancelled, neutral, timed-out, or failed required job is not acceptance evidence.

The following findings block release:

- any Rust advisory, prohibited license, wildcard dependency, or unapproved registry/source rejected by `cargo deny check`;
- any secret finding from Gitleaks across the complete reachable Git history;
- any CRITICAL vulnerability reported by Trivy in either release image;
- any ShellCheck, actionlint, BuildKit Dockerfile check, or Compose validation failure;
- any AddressSanitizer, ThreadSanitizer, or Miri failure;
- any ordinary formatting, Clippy, unit, documentation, desktop, native-adapter, Compose, integration, API, or end-to-end failure.

HIGH image vulnerabilities are retained in the JSON evidence and must be reviewed. They are not automatic v0.1 blockers unless they are exploitable in the shipped configuration, affect a security boundary, or are escalated by the release reviewer. CRITICAL findings are always blocking.

## Exceptions

There are no implicit or silent exceptions. An exception requires a repository issue that records the exact finding identifier, affected component and image digest, owner, rationale, compensating controls, approval, and an expiry no later than 30 days. The exception must be linked from this document and from the release evidence. Inline ignores without that record are prohibited.

No v0.1 exception is currently approved.

## Native-safety coverage and limitations

AddressSanitizer instruments the Rust LibVNCClient adapter and its boundary tests. ThreadSanitizer is limited to Rust-only shared-state tests because combining TSan with the distribution LibVNCClient shared library is not a reliable signal. Rust does not expose a general UBSan mode; Miri is the release gate for Rust undefined behavior and provenance checks. The Debian LibVNCClient shared library is not rebuilt with sanitizers, so upstream native-library defects remain outside this repository's instrumentation boundary.

These limitations must remain visible in the release evidence. A sanitizer command may not be changed to `continue-on-error`, wrapped in an unconditional success fallback, or replaced by a compile-only check without an explicit policy update.

## Image and artifact evidence

CI builds the controller and desktop release images from the candidate commit, scans both images, and generates CycloneDX SBOMs. Security and native-safety artifacts are retained for 30 days. Failure artifacts must remain sanitized and must not contain bearer tokens, VNC passwords, typed text, clipboard payloads, or framebuffer screenshots.

## Tool pinning

The release gate pins the Rust stable and nightly toolchains, cargo-deny, actionlint, Gitleaks, Trivy, and GitHub Actions by immutable version or commit. Downloaded release archives are checked against the publisher-provided checksum manifest before installation.
'''
          (root / 'docs/VNC_REMOTE_CONTROL_SERVER_RELEASE_POLICY_2026-08-05.md').write_text(
              policy, encoding='utf-8'
          )

          tests = r'''from __future__ import annotations

import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
CI = ROOT / ".github/workflows/ci.yml"
POLICY = ROOT / "docs/VNC_REMOTE_CONTROL_SERVER_RELEASE_POLICY_2026-08-05.md"


class ReleasePolicyContractTests(unittest.TestCase):
    def test_ci_contains_fail_closed_release_jobs(self):
        text = CI.read_text(encoding="utf-8")
        required = (
            "native_safety:",
            "security:",
            "cargo deny check",
            "actionlint .github/workflows/*.yml",
            "shellcheck \\",
            "docker buildx build --check",
            "docker compose -f deploy/compose.yaml config --quiet",
            "gitleaks git --redact --no-banner --exit-code 1 .",
            "--severity CRITICAL",
            "--exit-code 1",
            "--format cyclonedx",
            "-Zsanitizer=address",
            "-Zsanitizer=thread",
            "miri test",
        )
        for value in required:
            with self.subTest(value=value):
                self.assertIn(value, text)
        self.assertNotIn("continue-on-error: true", text)

    def test_cache_and_actions_are_immutably_pinned(self):
        text = CI.read_text(encoding="utf-8")
        self.assertIn(
            "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
            text,
        )
        self.assertNotIn("actions/cache@v", text)
        self.assertIn("fetch-depth: 0", text)

    def test_security_policy_forbids_silent_exceptions(self):
        text = POLICY.read_text(encoding="utf-8")
        self.assertIn("There are no implicit or silent exceptions", text)
        self.assertIn("CRITICAL findings are always blocking", text)
        self.assertIn("No v0.1 exception is currently approved", text)
        self.assertIn("may not be changed to `continue-on-error`", text)
        self.assertIn("must not contain bearer tokens", text)


if __name__ == "__main__":
    unittest.main()
'''
          (root / 'tests/test_release_policy_contract.py').write_text(tests, encoding='utf-8')
          PY

          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          for marker in (
              'native_safety:',
              'security:',
              'cargo deny check',
              'gitleaks git --redact --no-banner --exit-code 1 .',
              '-Zsanitizer=address',
              '-Zsanitizer=thread',
              'miri test',
          ):
              if marker not in text:
                  raise SystemExit(f'missing permanent release-gate marker: {marker}')
          PY
          git diff --check

      - name: Commit permanent R14/R16 foundation directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add \
            .github/workflows/ci.yml \
            docs/VNC_REMOTE_CONTROL_SERVER_RELEASE_POLICY_2026-08-05.md \
            tests/test_release_policy_contract.py
          git diff --cached --check
          git commit -m 'Add fail-closed v0.1 release gates'
          git push origin HEAD:master
