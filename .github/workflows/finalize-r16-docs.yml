name: Finalize R16 Documentation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/finalize-r16-docs.yml

permissions:
  contents: write

concurrency:
  group: finalize-r16-docs
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master

      - name: Apply R16 checklist and README acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          README = Path("README.md")
          TODO = Path("docs/VNC_REMOTE_CONTROL_SERVER_REBASE_TODO_2026-08-03.md")
          EVIDENCE = "docs/VNC_REMOTE_CONTROL_SERVER_R16_EVIDENCE_2026-08-05.md"
          CANDIDATE = "dd3b14917ad5e239573d584238ff67ded8138203"

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def patch_section(text, start_marker, end_marker, evidence_marker, evidence):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              section = section.replace("- [ ]", "- [x]")
              marker = section.index(evidence_marker)
              fence = section.index("```text\n", marker) + len("```text\n")
              fence_end = section.index("\n```", fence)
              section = section[:fence] + evidence.rstrip() + section[fence_end:]
              if "- [ ]" in section:
                  raise SystemExit(f"unchecked items remain in {start_marker.strip()}")
              return text[:start] + section + text[end:]

          readme = README.read_text(encoding="utf-8")
          ci_badge = "[![CI/CD](https://github.com/ekkus93/vnc-remote-control-server/actions/workflows/ci.yml/badge.svg?branch=master)](https://github.com/ekkus93/vnc-remote-control-server/actions/workflows/ci.yml)\n"
          release_badge = "[![Release Gates](https://github.com/ekkus93/vnc-remote-control-server/actions/workflows/release-gates.yml/badge.svg?branch=master)](https://github.com/ekkus93/vnc-remote-control-server/actions/workflows/release-gates.yml)\n"
          if release_badge not in readme:
              readme = replace_once(readme, ci_badge, ci_badge + release_badge, "README badge")
          readme = replace_once(
              readme,
              "The service is not yet declared a final v0.1 release. Security hardening and the final same-SHA acceptance gate remain separate milestones.",
              f"v0.1 is accepted on release-candidate commit `{CANDIDATE}`. Both permanent `CI` and `Release Gates` workflows passed on that exact SHA. See [`{EVIDENCE}`]({EVIDENCE}) for the acceptance matrix, retained artifacts, security determinations, and known limitations.",
              "README status",
          )
          README.write_text(readme, encoding="utf-8")

          todo = TODO.read_text(encoding="utf-8")
          r14_evidence = f"""Release candidate: {CANDIDATE}
          CI run 31029834071: success
          Release Gates run 31029833868: success
          Coverage: fmt, Clippy, tests, rustdoc, ShellCheck, actionlint, Docker/Compose checks, cargo-deny, Gitleaks history, ASan, TSan, Miri, Trivy exact VEX, CycloneDX SBOMs, and real VNC/HTTP/Compose E2E
          Policy: docs/VNC_REMOTE_CONTROL_SERVER_RELEASE_POLICY_2026-08-05.md
          VEX revalidation: issue #7; expires 2026-09-04"""
          todo = patch_section(
              todo,
              "## R14 — CI hardening and security policy\n",
              "\n## R15 — README",
              "Evidence:\n",
              r14_evidence,
          )

          todo = replace_once(
              todo,
              "- [ ] Horizontal scrolling works and is tested, or is removed from v0.1 API/spec.",
              "- [x] Nonzero horizontal scrolling is explicitly rejected and tested as unsupported in v0.1.",
              "horizontal-scroll acceptance criterion",
          )
          r16_evidence = f"""Release candidate commit: {CANDIDATE}

          Toolchain: Rust 1.97.1; nightly 1.99.0-nightly; Debian 13.6 slim pinned digest; TigerVNC 1.15.0+dfsg-2.1~deb13u1; release LibVNCClient 0.9.15+dfsg-1+deb13u2; Docker 28.0.4

          Validation:
          - CI run 31029834071 — success
          - Quality job 92387470896 — success
          - Desktop/integration job 92387470858 — success
          - Release Gates run 31029833868 — success
          - Static/security job 92387653372 — success
          - Image/SBOM job 92387653399 — success
          - Native sanitizer/Miri job 92387653418 — success

          Results: formatting, warning-denied Clippy, unit/rustdoc, desktop/native/Compose smoke, integration/E2E, ASan, TSan, Miri, cargo-deny, Gitleaks history, Trivy exact VEX, and SBOM gates all passed.

          Known limitations: one project-owned desktop; no arbitrary VNC targets, multi-user auth, noVNC, OCR, accessibility automation, Playwright, or AI planning; reverse proxy required for TLS beyond localhost; horizontal scroll unsupported; typed text limited to tab/CR/LF and printable ASCII; inbound RFB clipboard must be valid UTF-8; distribution LibVNCClient is not sanitizer-rebuilt; VEX determinations expire 2026-09-04.

          Release decision: ACCEPTED FOR v0.1
          Evidence: {EVIDENCE}"""
          todo = patch_section(
              todo,
              "## R16 — Final v0.1 acceptance gate\n",
              "\n## Post-v0.1 backlog",
              "### R16.7 Final evidence record\n",
              r16_evidence,
          )
          TODO.write_text(todo, encoding="utf-8")

          for path in (README, TODO):
              if not path.read_text(encoding="utf-8").endswith("\n"):
                  raise SystemExit(f"{path} missing final newline")
          print("R14 and R16 acceptance documentation prepared")
          PY
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

      - name: Commit R16 acceptance documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ekkus93'
          git config user.email '1386709+ekkus93@users.noreply.github.com'
          git add README.md docs/VNC_REMOTE_CONTROL_SERVER_REBASE_TODO_2026-08-03.md
          git diff --cached --check
          git commit -m 'Complete R16 v0.1 acceptance documentation'
          git push origin HEAD:master
