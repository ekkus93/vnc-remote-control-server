name: One-time stale branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-stale-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete assistant-created stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "codex/r10-runtime"
            "r7-png-lock-prep"
            "r7-worker-framebuffer-clippy-fix"
            "r8-pinned-rustfmt-prep-20260804"
            "r10-runtime-candidate"
            "worker-framebuffer-clippy-prep"
            "worker-framebuffer-fmt-prep"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
