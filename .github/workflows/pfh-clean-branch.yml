name: PFH Clean Branch

on:
  push:
    branches:
      - ralph/post-fcr-hardening-implementation-20260914

permissions:
  contents: write

jobs:
  create-clean-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Create clean implementation branch from master
        run: |
          set -euo pipefail
          clean_branch='ralph/post-fcr-hardening-clean-20260914'
          source_ref='25416da4a7778277fa12a1bc3e6edfb5326ddb24'
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          git checkout -B "${clean_branch}" origin/master
          git checkout "${source_ref}" -- \
            crates/controller-api/src/config.rs \
            crates/controller-api/src/duration_policy.rs \
            python/src/vnc_remote_control/client.py \
            python/src/vnc_remote_control/mcp_outcomes.py \
            tests/test_post_fcr_hardening.py \
            docs/VNC_REMOTE_CONTROL_SERVER_POST_FCR_HARDENING_TODO_2026-09-14.md
          git add \
            crates/controller-api/src/config.rs \
            crates/controller-api/src/duration_policy.rs \
            python/src/vnc_remote_control/client.py \
            python/src/vnc_remote_control/mcp_outcomes.py \
            tests/test_post_fcr_hardening.py \
            docs/VNC_REMOTE_CONTROL_SERVER_POST_FCR_HARDENING_TODO_2026-09-14.md
          git diff --cached --check
          git config user.name 'chatgpt-ralph-bridge[bot]'
          git config user.email '326723642+chatgpt-ralph-bridge[bot]@users.noreply.github.com'
          git commit -m 'fix: implement post-FCR fail-closed hardening'
          git push origin "${clean_branch}:${clean_branch}"
