name: R10 HTTP Dependency Candidate

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/r10-http-deps-candidate.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  candidate:
    name: Resolve and validate HTTP dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libvncserver-dev pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Add pinned HTTP dependencies in runner checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("Cargo.toml")
          text = root.read_text(encoding="utf-8")
          target = "[workspace.dependencies]\npng = \"0.18.1\"\n"
          replacement = (
              "[workspace.dependencies]\n"
              "axum = { version = \"=0.8.9\", default-features = false, features = [\"http1\", \"json\", \"tokio\"] }\n"
              "png = \"0.18.1\"\n"
              "serde_json = \"1.0.140\"\n"
              "subtle = \"=2.6.1\"\n"
              "tokio = { version = \"=1.52.3\", default-features = false, features = [\"macros\", \"net\", \"rt-multi-thread\", \"signal\", \"sync\", \"time\"] }\n"
              "tower = { version = \"=0.5.2\", default-features = false, features = [\"util\"] }\n"
          )
          if text.count(target) != 1:
              raise SystemExit("root workspace dependency insertion target is not unique")
          root.write_text(text.replace(target, replacement, 1), encoding="utf-8")

          controller = Path("crates/controller-api/Cargo.toml")
          text = controller.read_text(encoding="utf-8")
          dependency_target = (
              "[dependencies]\n"
              "libvnc-adapter = { path = \"../libvnc-adapter\" }\n"
          )
          dependency_replacement = (
              "[dependencies]\n"
              "axum.workspace = true\n"
              "libvnc-adapter = { path = \"../libvnc-adapter\" }\n"
          )
          if text.count(dependency_target) != 1:
              raise SystemExit("controller dependency insertion target is not unique")
          text = text.replace(dependency_target, dependency_replacement, 1)
          text = text.replace(
              "serde.workspace = true\n\n[dev-dependencies]\nserde_json = \"1.0.140\"\n",
              "serde.workspace = true\nserde_json.workspace = true\nsubtle.workspace = true\ntokio.workspace = true\n\n[dev-dependencies]\ntower.workspace = true\n",
              1,
          )
          if "serde_json = \"1.0.140\"" in text or text.count("tower.workspace = true") != 1:
              raise SystemExit("controller HTTP dependency transformation failed")
          controller.write_text(text, encoding="utf-8")
          PY

      - name: Resolve HTTP dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before-r10-http"
          cargo check --workspace --all-targets --all-features

      - name: Verify lockfile dependency transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          before = tomllib.loads(
              Path(os.environ["RUNNER_TEMP"], "Cargo.lock.before-r10-http").read_text(
                  encoding="utf-8"
              )
          )
          after = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))

          if before.get("version") != after.get("version"):
              raise SystemExit("Cargo.lock format version changed")
          if before.get("metadata") != after.get("metadata"):
              raise SystemExit("Cargo.lock metadata changed")

          def keyed(document):
              result = {}
              for package in document.get("package", []):
                  key = (
                      package.get("name"),
                      package.get("version"),
                      package.get("source"),
                  )
                  if key in result:
                      raise SystemExit(f"duplicate Cargo.lock package key: {key}")
                  result[key] = package
              return result

          before_packages = keyed(before)
          after_packages = keyed(after)
          removed = before_packages.keys() - after_packages.keys()
          if removed:
              raise SystemExit(f"existing Cargo.lock packages were removed: {sorted(removed)!r}")

          controller_keys = [
              key for key in before_packages if key[0] == "controller-api" and key[2] is None
          ]
          if len(controller_keys) != 1:
              raise SystemExit(
                  f"expected one local controller-api lock package, found {controller_keys!r}"
              )
          controller_key = controller_keys[0]
          expected_direct_additions = {"axum", "subtle", "tokio", "tower"}

          for key, before_package in before_packages.items():
              after_package = after_packages[key]
              if key == controller_key:
                  before_without_dependencies = {
                      field: value
                      for field, value in before_package.items()
                      if field != "dependencies"
                  }
                  after_without_dependencies = {
                      field: value
                      for field, value in after_package.items()
                      if field != "dependencies"
                  }
                  if before_without_dependencies != after_without_dependencies:
                      raise SystemExit("controller-api lock metadata changed unexpectedly")
                  before_dependencies = set(before_package.get("dependencies", []))
                  after_dependencies = set(after_package.get("dependencies", []))
                  if after_dependencies != before_dependencies | expected_direct_additions:
                      raise SystemExit(
                          "controller-api direct lock dependencies changed unexpectedly: "
                          f"before={sorted(before_dependencies)!r} "
                          f"after={sorted(after_dependencies)!r}"
                      )
              elif before_package != after_package:
                  raise SystemExit(f"existing third-party lock package changed: {key}")

          added_keys = sorted(after_packages.keys() - before_packages.keys())
          if not added_keys:
              raise SystemExit("HTTP dependency resolution added no lock packages")
          for key in added_keys:
              package = after_packages[key]
              source = package.get("source", "")
              checksum = package.get("checksum", "")
              if not source.startswith("registry+") or not checksum:
                  raise SystemExit(
                      f"new dependency lacks registry source/checksum: {key} {package!r}"
                  )

          required_packages = {
              ("axum", "0.8.9"),
              ("subtle", "2.6.1"),
              ("tokio", "1.52.3"),
              ("tower", "0.5.2"),
          }
          actual_name_versions = {(key[0], key[1]) for key in after_packages}
          missing = required_packages - actual_name_versions
          if missing:
              raise SystemExit(f"required pinned HTTP packages are missing: {sorted(missing)!r}")

          evidence = {
              "schema_version": 1,
              "added_packages": [
                  {
                      "name": key[0],
                      "version": key[1],
                      "source": key[2],
                      "checksum": after_packages[key]["checksum"],
                  }
                  for key in added_keys
              ],
              "required_direct_packages": sorted(
                  {name: version for name, version in required_packages}.items()
              ),
          }
          evidence_path = Path("artifacts/r10-http-dependencies.json")
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Format candidate
        run: cargo fmt --all

      - name: Reject whitespace errors
        run: git diff --check

      - name: Run locked quality gates
        env:
          RUSTFLAGS: -Dwarnings
          RUSTDOCFLAGS: -Dwarnings
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo doc --locked --workspace --all-features --no-deps
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Upload dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r10-http-dependencies-${{ github.run_id }}
          path: artifacts/r10-http-dependencies.json
          if-no-files-found: error
          retention-days: 30

      - name: Create exact cleanup candidate commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- .github/workflows/r10-http-deps-candidate.yml
          git add -A -- \
            .github/workflows/r10-http-deps-candidate.yml \
            Cargo.lock \
            Cargo.toml \
            crates/controller-api/Cargo.toml

          expected="$(mktemp)"
          actual="$(mktemp)"
          cat >"$expected" <<'EOF'
          .github/workflows/r10-http-deps-candidate.yml
          Cargo.lock
          Cargo.toml
          crates/controller-api/Cargo.toml
          EOF
          git diff --cached --name-only | LC_ALL=C sort >"$actual"
          LC_ALL=C sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add locked R10 HTTP dependencies"

          candidate_sha="$(git rev-parse HEAD)"
          tag="r10-http-deps-${GITHUB_RUN_ID}"
          git tag "$tag" "$candidate_sha"
          git push origin "refs/tags/$tag"
          printf 'candidate_sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Publish candidate locator
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.candidate_sha }}
          CANDIDATE_TAG: ${{ steps.commit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1 --body "<!-- r10-http-deps-commit --> R10 HTTP dependency commit ready. Run: ${{ github.run_id }}. Candidate: ${CANDIDATE_SHA}. Ref: refs/tags/${CANDIDATE_TAG}. Artifact: r10-http-dependencies-${{ github.run_id }}."

      - name: Wait for master and remove temporary tag
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.candidate_sha }}
          CANDIDATE_TAG: ${{ steps.commit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
              master_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/master --jq '.object.sha')"
              if [[ "$master_sha" == "$CANDIDATE_SHA" ]]; then
                  git push origin ":refs/tags/$CANDIDATE_TAG"
                  gh issue comment 1 --body "<!-- r10-http-deps-cleanup --> R10 HTTP dependency candidate ${CANDIDATE_SHA} reached master; temporary tag ${CANDIDATE_TAG} was removed."
                  exit 0
              fi
              sleep 10
          done
          printf 'master did not advance to validated candidate %s before cleanup deadline\n' "$CANDIDATE_SHA" >&2
          exit 1

      - name: Publish failed candidate locator
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1 --body "<!-- r10-http-deps-candidate --> R10 HTTP dependency candidate failed. Run: ${{ github.run_id }}. SHA: ${{ github.sha }}."
