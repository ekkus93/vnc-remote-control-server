name: Apply correctness test repairs

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-correctness-test-repairs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply deterministic test and RGBX observation repairs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/apply.py
          python3 /tmp/apply.py
          cargo fmt --all
          git diff --check
      - name: Commit repairs and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-correctness-test-repairs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/controller-api/src/http/tests/privacy.rs \
            crates/controller-api/src/worker/tests/privacy.rs \
            crates/controller-api/src/worker/tests/reconnect.rs \
            crates/controller-api/src/bin/worker-text-clipboard-e2e.rs \
            .github/workflows/apply-correctness-test-repairs.yml
          git commit -m "Repair deterministic correctness regressions"
          git push origin HEAD:master
